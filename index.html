<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#343166">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<title>Shay's Vet Field Guide</title>
<style>
:root{
  --purple:#343166; --purple-lite:#4a477a; --green:#2d6a2d; --green-lite:#3d8a3d;
  --bronze:#7f5539; --grey:#5a5a5a; --ink:#1a1a2e; --muted:#6b6b80;
  --bg:#f4f4f8; --card:#ffffff; --line:#e4e4ee; --tint:#eeedf6; --tint-g:#e9f2e9;
  --red:#b3202a; --terra:#b5612f; --terra-tint:#f5ebe3;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
header{position:sticky;top:0;z-index:50;background:var(--purple);color:#fff;
  padding:env(safe-area-inset-top) 0 0;box-shadow:0 2px 10px rgba(52,49,102,.25)}
.hwrap{padding:11px 16px 12px;display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:8px;background:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  color:var(--purple);font-size:17px;letter-spacing:-1px}
.brand{flex:1;min-width:0}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.1}
.brand span{font-size:10.5px;opacity:.7;font-weight:500}
.ver{font-size:9px;background:var(--bronze);padding:3px 7px;border-radius:20px;
  font-weight:700;letter-spacing:.5px;white-space:nowrap}
.searchwrap{padding:10px 14px;background:var(--purple);position:sticky;
  top:calc(58px + env(safe-area-inset-top));z-index:49}
.searchbox{display:flex;align-items:center;background:rgba(255,255,255,.14);
  border-radius:11px;padding:0 12px;border:1.5px solid rgba(255,255,255,.14);position:relative}
.searchbox:focus-within{background:#fff;border-color:#fff}
.searchbox:focus-within input{color:var(--ink)}
.searchbox:focus-within .sicon{color:var(--purple)}
.sicon{color:rgba(255,255,255,.7);font-size:16px;flex-shrink:0}
.searchbox input{flex:1;border:none;background:none;outline:none;padding:11px 9px;
  font-size:15px;color:#fff;font-weight:500}
.searchbox input::placeholder{color:rgba(255,255,255,.6)}
.clearbtn{color:var(--muted);font-size:19px;padding:2px 4px;display:none;cursor:pointer}
.searchbox.hasval .clearbtn{display:block}
.ac{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;
  border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.22);overflow:hidden;
  z-index:60;max-height:62vh;overflow-y:auto;display:none}
.ac.show{display:block}
.ac-item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;gap:10px}
.ac-item:last-child{border-bottom:none}
.ac-item:active,.ac-item.sel{background:var(--tint)}
.ac-nm{flex:1;font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
.ac-tag{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 7px;border-radius:20px;white-space:nowrap;color:#fff}
.ac-tag.bw{background:var(--purple)} .ac-tag.dx{background:var(--green)}
.ac-tag.tt{background:var(--bronze)} .ac-tag.pt{background:var(--grey)}
.ac-tag.vt{background:var(--green-lite)}
.ac-more{padding:10px 14px;text-align:center;font-size:12px;font-weight:600;
  color:var(--purple);cursor:pointer;background:var(--tint)}
.tabs{display:flex;background:var(--card);position:sticky;
  top:calc(58px + 60px + env(safe-area-inset-top));z-index:48;
  border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.03)}
.tab{flex:1;text-align:center;padding:13px 4px 11px;font-size:13.5px;font-weight:600;
  color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;transition:color .15s}
.tab.active{color:var(--purple);border-bottom-color:var(--purple)}
.tab.dxtab.active{color:var(--green);border-bottom-color:var(--green)}
.subtabs{display:flex;gap:6px;padding:11px 12px 4px;max-width:640px;margin:0 auto}
.subtab{flex:1;text-align:center;padding:8px 2px;font-size:11px;font-weight:600;
  color:var(--muted);background:var(--card);border:1px solid var(--line);
  border-radius:9px;cursor:pointer;transition:all .15s;white-space:nowrap}
.subtab.active{color:#fff;background:var(--purple);border-color:var(--purple)}
/* Sheep & Goats colour split within DDx */
.grp.sheep .grp-h{color:var(--terra)}
.grp.sheep .item:active{background:var(--terra-tint)}
.dxmode .d-head.sheep{background:var(--terra)}
.dxmode .backbtn.sheep{color:var(--terra)}
.dxmode .d-lbl.hi.sheep{color:var(--terra)}
ul.diffs.sheep li:before{color:var(--terra)}
.ddxgrp{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  color:var(--green);margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--tint-g)}
.ddxgrp:first-child{margin-top:2px}
.ddxgrp.sheep{color:var(--terra);border-bottom-color:var(--terra-tint)}
ul.diffs{margin-bottom:2px}
.species-band{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  margin:16px 4px 8px;padding-bottom:5px;border-bottom:2px solid}
.species-band.cattle{color:var(--green);border-color:var(--green)}
.species-band.sheep{color:var(--terra);border-color:var(--terra)}
.species-band:first-child{margin-top:6px}
main{padding:6px 12px 40px;max-width:640px;margin:0 auto}
.crumb{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
  letter-spacing:.6px;margin:14px 4px 7px}
.crumb:first-child{margin-top:6px}
.grp{background:var(--card);border-radius:12px;margin-bottom:9px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.grp-h{padding:14px 15px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:700;font-size:14px;color:var(--purple)}
.grp-h .cnt{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto;margin-right:9px}
.grp-h .chev{transition:transform .2s;color:var(--muted);font-size:13px}
.grp.open .grp-h .chev{transform:rotate(90deg)}
.grp-body{display:none} .grp.open .grp-body{display:block}
.dxmode .grp-h{color:var(--green)}
.item{padding:12px 15px;border-top:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;gap:9px}
.item:active{background:var(--tint)}
.item-nm{flex:1;font-size:13.5px;font-weight:600;line-height:1.25}
.item-meta{font-size:11px;color:var(--muted);font-weight:500}
.item .go{color:var(--line);font-size:15px}
.flag{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:var(--red);
  padding:2px 6px;border-radius:4px;letter-spacing:.4px;vertical-align:middle;margin-right:6px}
.detail{background:var(--card);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px}
.d-head{background:var(--purple);color:#fff;padding:16px 17px}
.dxmode .d-head{background:var(--green)} .d-head.tox{background:var(--bronze)}
.d-head h2{font-size:17px;font-weight:700;line-height:1.2}
.d-head .ref{font-size:12.5px;opacity:.85;margin-top:3px;font-weight:500}
.d-sec{padding:13px 16px;border-top:1px solid var(--line)}
.d-lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  margin-bottom:5px;display:flex;align-items:center;gap:6px}
.d-lbl.hi{color:var(--purple)} .dxmode .d-lbl.hi{color:var(--green)}
.d-lbl.lo{color:var(--bronze)} .d-lbl.note{color:var(--muted)}
.d-txt{font-size:13.5px;line-height:1.5;color:#222}
.d-txt .phen{font-size:11.5px;color:var(--muted);font-style:italic;font-weight:600}
ul.diffs{list-style:none;font-size:13.5px;line-height:1.5}
ul.diffs li{padding:3px 0 3px 15px;position:relative;color:#222}
ul.diffs li:before{content:"–";position:absolute;left:0;color:var(--green);font-weight:700}
.note-box{background:var(--tint);font-style:italic;color:#555;font-size:12.5px;
  line-height:1.45;padding:11px 16px;border-top:1px solid var(--line)}
.backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--purple);
  font-weight:700;font-size:13.5px;padding:12px 4px;cursor:pointer}
.dxmode .backbtn{color:var(--green)}
.pat{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:11px;
  box-shadow:0 1px 4px rgba(0,0,0,.05)}
.pat-h{background:var(--green);color:#fff;padding:12px 15px;font-weight:700;font-size:13.5px}
.pat-row{display:flex;border-top:1px solid var(--line)}
.pat-nm{width:38%;background:var(--green);color:#fff;padding:10px 12px;
  font-size:11.5px;font-weight:700;line-height:1.3}
.pat-dc{flex:1;background:var(--tint-g);padding:10px 12px;font-size:11.5px;
  line-height:1.4;color:#1a1a1a}
.lab-sec{padding:11px 16px;border-top:1px solid var(--line)}
.lab-sec .k{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--bronze);
  text-transform:uppercase;margin-bottom:3px}
.lab-sec .v{font-size:13px;line-height:1.45;color:#222}
.lab-sec.pm .k{color:var(--purple)} .lab-sec.pm .v{font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.4}
.rescount{font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 4px 4px}
mark{background:#ffe9a8;color:inherit;padding:0 1px;border-radius:2px}
.fadein{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.item .go{transition:transform .2s}.item.op{background:var(--tint)}.item.op .go{transform:rotate(90deg);color:var(--muted)}
.inl{padding:2px 16px 12px;background:#fbfbfe;border-top:1px dashed var(--line)}
.inl .d-lbl{margin-top:11px}.inl .lab-sec{padding:9px 0;border-top:1px solid var(--line)}.inl .lab-sec:first-child{border-top:none}
.inl-note{background:var(--tint);font-style:italic;color:#555;font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:8px;margin-top:10px}
.tab-intro{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 4px 10px}
.pcard{padding:11px 15px;border-top:1px solid var(--line)}.pname{font-weight:700;font-size:13.5px;color:var(--green);margin-bottom:3px;line-height:1.3}
.pdesc{font-size:13px;line-height:1.5;color:#222}.up{color:#b3202a;font-weight:800}.dn{color:#1f5fa8;font-weight:800}
.pcard{padding:13px 15px 14px;border-top:1px solid var(--line)}
.pname{font-weight:700;font-size:14px;color:var(--green);margin-bottom:7px;line-height:1.3}
.pfind{background:#f2f6f2;border-left:3px solid var(--green);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:13px;line-height:1.35}
.fchip{background:#fff;border:1px solid #cfdccf;border-radius:14px;padding:3px 9px}.fplus{color:var(--muted);font-weight:700}
.feq{color:var(--green);font-weight:800;margin:0 2px}.fres{font-weight:600}.ftext{line-height:1.45}
.ppts{margin-top:8px}.pline{position:relative;padding:3px 0 3px 14px;font-size:13px;line-height:1.45;color:#333}
.pline:before{content:"•";position:absolute;left:2px;color:var(--green);font-weight:700}
.plist{margin:6px 0 4px}.plabel{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ptags{display:flex;flex-wrap:wrap;gap:5px}.ptag{background:var(--tint);border-radius:12px;padding:3px 9px;font-size:12.3px;line-height:1.35;color:#222}
.pkey{margin-top:8px;background:#fff7dc;border:1px solid #f0dc9a;border-radius:8px;padding:7px 10px;font-size:12.8px;line-height:1.4}
.pkey span{font-size:10px;font-weight:800;color:#8a6d00;letter-spacing:.5px;margin-right:6px}
.dxinl{padding-top:4px}.dxinl .ddxgrp:first-child{margin-top:8px}
.grp.sheep .item.op{background:var(--terra-tint)}.grp.sheep .inl{background:#fdf9f6}
.zoo{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:#d97706;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px;font-style:normal}
.rep{display:inline-block;margin-top:12px;font-size:11.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:4px 10px;background:#fff}
.pcard .rep{margin-top:9px}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;background:var(--purple);color:#fff;border:none;border-radius:22px;padding:10px 15px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(52,49,102,.35);cursor:pointer;opacity:.94}
.fab:active{transform:scale(.96)}main{padding-bottom:80px}
.rowrep{color:var(--muted);text-decoration:none;font-size:15px;padding:2px 8px;margin-right:2px;border:1px solid var(--line);border-radius:12px;background:#fff;line-height:1.2}
.ibar{position:fixed;top:0;left:0;right:0;z-index:90;background:#1f1d3d;color:#fff;display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;padding-top:calc(9px + env(safe-area-inset-top))}
.ibar span{flex:1}.ibtn{background:#fff;color:var(--purple);border:none;border-radius:16px;padding:6px 13px;font-size:12.5px;font-weight:800}
.ix{background:none;border:none;color:#fff;font-size:20px;opacity:.7;padding:0 4px}
.reg{position:fixed;inset:0;z-index:95;background:rgba(26,26,46,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.regbox{background:#fff;border-radius:16px;padding:20px;max-width:360px;width:100%;direction:rtl;text-align:right;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.regbox h3{font-size:17px;color:var(--purple);margin-bottom:6px}.regbox p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.regbox input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:9px;font-family:inherit}
.rgo{width:100%;background:var(--purple);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;margin-top:4px}
.rgskip{width:100%;background:none;border:none;color:var(--muted);font-size:13px;padding:10px;margin-top:2px}
.beta{max-width:640px;margin:8px auto 0;padding:8px 14px;font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center;direction:rtl}
</style>

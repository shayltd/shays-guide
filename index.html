 const key='dx'+i,label=esc(sec.name.replace(/^(CATTLE|SHEEP & GOATS)\s*\u2014\s*/i,''));
 h+='<div class="grp '+(sheep?'sheep ':'')+(openGroups[key]?'open':'')+'" id="grp-'+key+'"><div class="grp-h" onclick="toggleGrp(\''+key+'\')"><span>'+label+'</span><span class="cnt">'+sec.items.length+(sec.items.length===1?' sign':' signs')+'</span><span class="chev">&#9656;</span></div><div class="grp-body">';
 sec.items.forEach(s=>{const k='dxi'+DATA.ddx.indexOf(s);h+=itemRow(k,esc(s.sign),'');if(openItems[k])h+=ddxDetail(s);});h+='</div></div>';});app.innerHTML=h;}
function ddxDetail(s){const sh=isSheep(s.section)?' sheep':'';let h='<div class="inl dxinl">';
 if(s.groups){for(const g in s.groups){h+='<div class="ddxgrp'+sh+'">'+esc(g)+'</div><ul class="diffs'+sh+'">'+s.groups[g].map(d=>'<li>'+arrows(d)+zb(d)+'</li>').join('')+'</ul>';}}
 else h+='<ul class="diffs'+sh+'">'+s.differentials.map(d=>'<li>'+arrows(d)+zb(d)+'</li>').join('')+'</ul>';return h+reportLink(s.sign)+'</div>';}
function scrollToEl(el,off){if(!el)return;const y=el.getBoundingClientRect().top+window.scrollY-(off||190);window.scrollTo({top:y,behavior:'smooth'});}
function renderVitals(){let h='';vitalGroups().forEach((g,i)=>{const key='vt'+i;if(openGroups[key]===undefined)openGroups[key]=true;h+=grpHead(key,esc(g.name),g.items.length);
 g.items.forEach(v=>{const k='vti'+DATA.vitals.indexOf(v);h+=itemRow(k,esc(v.disease),'');if(openItems[k])h+=vtDetail(v);});h+='</div></div>';});app.innerHTML=h;}
function showVital(i){gotoItem('vt',i);}
function capsFix(html){const AC=/^(EDTA|NEFA|SARA|BRSV|CCPP|AGID|IFAT|MCHC|DIVA|ELISA|SICCT|NSAID|FAMACHA|PRNP|BVDV|ETEC|SIRS|TEME|BLAD|EHDV|BTV|RDW|WOAH)$/;
 return html.replace(/\b[A-Z]{2,}(?:[ \-][A-Z]{2,})*\b/g,(w,off,str)=>{const letters=w.replace(/[^A-Z]/g,'').length;if(letters<4||AC.test(w))return w;const pre=str.slice(0,off).replace(/<[^>]*>/g,'').trimEnd();const start=!pre||/[.:;(\u2014=\u21d2+\-]$/.test(pre);const low=w.toLowerCase();return '<b>'+(start?low.charAt(0).toUpperCase()+low.slice(1):low)+'</b>';});}
function fmt(s){return capsFix(arrows(s));}
function topSplit(s,sep){const out=[];let cur='',d=0;for(const ch of s){if(ch==='('||ch==='[')d++;if(ch===')'||ch===']')d--;if(ch===sep&&d===0){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out.map(x=>x.trim()).filter(Boolean);}
function findingHtml(f){if(!f)return'';let left=f,right='';if(f.includes('=')){const k=f.indexOf('=');left=f.slice(0,k);right=f.slice(k+1);}
 const parts=topSplit(left,'+');let h='<div class="pfind">';
 if(parts.length>1)h+=parts.map(x=>'<span class="fchip">'+fmt(x)+'</span>').join('<span class="fplus">+</span>');else h+='<span class="ftext">'+fmt(left)+'</span>';
 if(right)h+='<span class="feq">⇒</span><span class="fres">'+fmt(right)+'</span>';return h+'</div>';}
function renderPatterns(){let h='<div class="tab-intro">Read the whole panel, not single values. <span class="up">↑</span> increased · <span class="dn">↓</span> decreased</div>';
 DATA.patterns.forEach((p,i)=>{h+=grpHead('pt'+i,esc(p.title),p.items.length);
  p.items.forEach(it=>{const s=it.s||{finding:it.desc,points:[],key:''};h+='<div class="pcard"><div class="pname">'+esc(it.name)+'</div>'+findingHtml(s.finding);
   if(s.points.length){h+='<div class="ppts">';s.points.forEach(pt=>{
     if(pt.items){h+='<div class="plist">'+(pt.label?'<div class="plabel">'+fmt(pt.label)+'</div>':'')+'<div class="ptags">'+pt.items.map(x=>'<span class="ptag">'+fmt(x)+'</span>').join('')+'</div></div>';}
     else h+='<div class="pline">'+fmt(pt.text)+'</div>';});h+='</div>';}
   if(s.key)h+='<div class="pkey"><span>KEY</span>'+fmt(s.key)+'</div>';h+=reportLink(it.name)+'</div>';});h+='</div></div>';});app.innerHTML=h;}
function renderTests(){let h='<div class="tab-intro">Which test and sample to send for each suspected disease, the expected result and key PM lesions. <span class="flag">!</span> = notifiable — report before sampling further.</div>';
 testGroups().forEach((g,i)=>{h+=grpHead('tg'+i,esc(g.name),g.items.length);g.items.forEach(t=>{const k='tti'+DATA.tests.indexOf(t);h+=itemRow(k,(t.notifiable?'<span class="flag">!</span>':'')+esc(t.disease)+zb(t.disease+' '+t.sample+' '+t.test),'');if(openItems[k])h+=ttDetail(t);});h+='</div></div>';});app.innerHTML=h;}
function showAnalyte(name){gotoItem('bw',DATA.bloodwork.findIndex(x=>x.name===name));}
function showDDx(idx){for(const k in openItems)delete openItems[k];tab='ddx';query='';searchEl.value='';sbox.classList.remove('hasval');const s=DATA.ddx[idx];
 const gi=ddxSections().findIndex(x=>x.items.includes(s));openGroups['dx'+gi]=true;openItems['dxi'+idx]=true;lastItem=s.sign;syncTabs();render();
 setTimeout(()=>scrollToEl(document.getElementById('it-dxi'+idx)),60);}
function showTest(i){gotoItem('tt',i);}
function backTo(t,s){tab=t;if(s)sub=s;query='';searchEl.value='';sbox.classList.remove('hasval');syncTabs();render();}

function renderFullSearch(){
  const all=buildAC(query);
  app.className=tab==='ddx'?'dxmode':'';
  if(!all.length){app.innerHTML='<div class="empty"><div class="big">&#9906;</div>No matches for "'+esc(query)+'"</div>';return;}
  let h='<div class="rescount">'+all.length+' result'+(all.length>1?'s':'')+' for "'+esc(query)+'"</div>';
  all.slice(0,100).forEach(r=>{
    if(r.t==='dx')h+='<div class="grp"><div class="item" onclick="showDDx('+r.i+')">'+
      '<span class="item-nm">'+hl(r.label)+'<div style="font-size:10.5px;color:var(--green);font-weight:500;margin-top:1px">DDx \u00b7 '+esc(r.sub)+'</div></span><span class="go">&#9656;</span></div></div>';
    if(r.t==='bw')h+='<div class="grp"><div class="item" onclick="showAnalyte(\''+esc(r.name).replace(/'/g,"\\'")+'\')">'+
      '<span class="item-nm">'+hl(r.label)+'<div style="font-size:10.5px;color:var(--purple);font-weight:500;margin-top:1px">Bloodwork \u00b7 '+esc(r.sub)+'</div></span><span class="go">&#9656;</span></div></div>';
    if(r.t==='tt')h+='<div class="grp"><div class="item" onclick="showTest('+r.i+')">'+
      '<span class="item-nm">'+(r.flag?'<span class="flag">!</span>':'')+hl(r.label)+'<div style="font-size:10.5px;color:var(--bronze);font-weight:500;margin-top:1px">Diagnostics \u00b7 '+esc(r.sub)+'</div></span><span class="go">&#9656;</span></div></div>';
    if(r.t==='pt')h+='<div class="grp"><div class="item" style="cursor:default">'+
      '<span class="item-nm">'+hl(r.label)+'<div style="font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px">Pattern \u00b7 '+esc(r.sub)+'</div></span></div></div>';
    if(r.t==='vt')h+='<div class="grp"><div class="item" onclick="showVital('+r.i+')">'+
      '<span class="item-nm">'+hl(r.label)+'<div style="font-size:10.5px;color:var(--green);font-weight:500;margin-top:1px">Normal value \u00b7 '+esc(r.sub)+'</div></span><span class="go">&#9656;</span></div></div>';
  });
  app.innerHTML=h;window.scrollTo(0,0);
}

function toggleGrp(key,defOpen){if(key.startsWith('pt')){const pi=+key.slice(2);if(!openGroups[key])lastItem=DATA.patterns[pi].title+' (pattern)';}
  if(defOpen&&openGroups[key]===undefined)openGroups[key]=false;
  else openGroups[key]=!openGroups[key];
  render();
}
function syncTabs(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  subtabsEl.style.display=tab==='results'?'flex':'none';
  document.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('active',x.dataset.sub===sub));
}
function render(){
  if(tab==='ddx'){app.className='dxmode';renderDDx();}
  else{app.className='';
    if(sub==='bloodwork')renderBloodwork();
    else if(sub==='tests')renderTests();
    else if(sub==='vitals')renderVitals();
    else renderPatterns();
  }
}
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  tab=t.dataset.tab;window.scrollTo(0,0);syncTabs();render();
});
subtabsEl.addEventListener('click',e=>{
  const s=e.target.closest('.subtab');if(!s)return;
  sub=s.dataset.sub;window.scrollTo(0,0);syncTabs();render();
});
searchEl.addEventListener('input',e=>{query=e.target.value.trim();sbox.classList.toggle('hasval',!!query);renderAC();});
searchEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();if(acSel>=0&&acResults[acSel])pickAC(acResults[acSel]);else if(query)showAllResults();}
  else if(e.key==='ArrowDown'){e.preventDefault();acSel=Math.min(acSel+1,Math.min(acResults.length,8)-1);updateSel();}
  else if(e.key==='ArrowUp'){e.preventDefault();acSel=Math.max(acSel-1,-1);updateSel();}
  else if(e.key==='Escape'){acEl.classList.remove('show');searchEl.blur();}
});
function updateSel(){acEl.querySelectorAll('.ac-item[data-idx]').forEach((el,i)=>el.classList.toggle('sel',i===acSel));}
document.getElementById('clear').addEventListener('click',()=>{
  searchEl.value='';query='';sbox.classList.remove('hasval');acEl.classList.remove('show');searchEl.focus();});
document.addEventListener('click',e=>{if(!sbox.contains(e.target))acEl.classList.remove('show');});
searchEl.addEventListener('focus',()=>{if(query)renderAC();});
syncTabs();render();

// ---- registration (stored on device; optional WhatsApp ping) ----
function who(){try{return JSON.parse(localStorage.getItem('shayGuideUser')||'null');}catch(e){return null;}}
function showReg(){const r=document.getElementById('reg');if(who()){r.style.display='none';return;}r.style.display='flex';
 document.getElementById('rgGo').onclick=()=>{const n=document.getElementById('rgName').value.trim();if(!n){document.getElementById('rgName').focus();return;}
  const o='';
  try{localStorage.setItem('shayGuideUser',JSON.stringify({n:n,o:o,t:Date.now()}));}catch(e){}
  r.style.display='none';
  window.open('https://wa.me/'+REPORT_PHONE+'?text='+encodeURIComponent('נרשמתי למדריך השטח\nשם: '+n+(o?'\nאזור: '+o:'')),'_blank');};}
// ---- install banner ----
let deferredPrompt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showInstallBar(){const bar=document.getElementById('ibar');if(isStandalone()||localStorage.getItem('shayGuideNoInstall'))return;
 const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(!deferredPrompt&&!iOS)return;
 if(iOS){document.getElementById('itxt').textContent='להתקנה: כפתור שיתוף ← הוסף למסך הבית';document.getElementById('ibtn').style.display='none';}
 bar.style.display='flex';document.body.style.paddingTop='42px';}
document.getElementById('ix').onclick=()=>{document.getElementById('ibar').style.display='none';document.body.style.paddingTop='';try{localStorage.setItem('shayGuideNoInstall','1');}catch(e){}};
document.getElementById('ibtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;
 document.getElementById('ibar').style.display='none';document.body.style.paddingTop='';};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallBar();});
window.addEventListener('appinstalled',()=>{document.getElementById('ibar').style.display='none';document.body.style.paddingTop='';});
setTimeout(showInstallBar,1200);

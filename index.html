<script>
const DATA = {"bloodwork":[{"part":"CBC","chapter":"Erythrogram (Red Cells)","name":"PCV / Hematocrit (HCT)","ref":"24–46","units":"%","high_term":"Polycythemia","low_term":"Anemia","increased":"Relative (most common): dehydration/hemoconcentration (check TP — both rise together); splenic contraction (excitement, exercise — mild, transient; cattle have poorly contractile spleen so less marked than horse); Absolute (polycythemia): chronic hypoxia (high altitude, cardiac/pulmonary disease); rarely primary (polycythemia vera — very rare in cattle); renal tumor producing erythropoietin (rare)","decreased":"Anemia — see full anemia work-up below; blood loss (hemorrhage — GI ulcer/abomasal, trauma, coagulopathy, heavy parasitism, lice, fluke, Hematobia/ticks); Hemolysis — tick-borne (hemoparasites): babesiosis (Babesia bovis/bigemina — redwater; INTRAvascular; hemoglobinuria); anaplasmosis (Anaplasma marginale — EXTRAvascular; icterus, NO hemoglobinuria); theileriosis (Theileria — endemic Middle East/Mediterranean); Mycoplasma wenyonii (Eperythrozoon); Hemolysis — non-parasitic: bacillary hemoglobinuria (Cl. hemolyticum); leptospirosis (hemolytic serovars — esp. L. Pomona in calves; INTRAvascular, hemoglobinuria); chronic copper toxicity (hemolytic crisis); post-parturient hemoglobinuria (hypophosphatemia, fresh dairy cows); water intoxication (calves); onion/brassica (Heinz-body); Decreased production: anemia of chronic/inflammatory disease, BVD marrow suppression, bracken fern, chronic renal disease, myelophthisis by lymphoma","notes":"Cattle PCV is LOWER than horses/dogs. Normal adult ~24–46%; calves higher."},{"part":"CBC","chapter":"Erythrogram (Red Cells)","name":"Hemoglobin (Hb)","ref":"80–150","units":"g/L","high_term":"","low_term":"Anemia","increased":"Same as PCV (dehydration, splenic contraction, polycythemia); artefactual: lipemia, marked leucocytosis, Heinz bodies, intravascular hemolysis (free Hb in plasma falsely raises measured Hb)","decreased":"Anemia (all causes — see PCV); usually parallels PCV. Discordance (low Hb, higher PCV) suggests iron deficiency or a sampling/analyser issue","notes":"Hemolysis/Heinz bodies falsely ↑ MCHC (free Hb)."},{"part":"CBC","chapter":"Erythrogram (Red Cells)","name":"RBC count","ref":"5.0–10.0","units":"×10^12/L","high_term":"Polycythemia","low_term":"Anemia","increased":"Dehydration; splenic contraction; absolute polycythemia (chronic hypoxia); breed/physiologic variation","decreased":"Anemia (all mechanisms — blood loss, hemolysis, ↓ production); always cross-check with PCV & Hb","notes":"Interpret RBC, PCV and Hb together. Use indices (MCV, MCHC) to classify anemia."},{"part":"CBC","chapter":"Erythrogram (Red Cells)","name":"MCV (mean cell volume)","ref":"38–51","units":"fL","high_term":"Macrocytosis","low_term":"Microcytosis","increased":"Macrocytic: regeneration (reticulocytosis — young large RBCs); FeLV-like marrow disorders (N/A cattle); artefact (RBC swelling in stored/old sample, hyponatremia); physiologic in some individuals","decreased":"Microcytic: iron deficiency (chronic blood loss — GI, lice, fluke; milk-fed calves); anemia of chronic disease (may be mild microcytic); portosystemic shunt (rare cattle); physiologic in calves/foals up to ~1 year (NOT disease)","notes":"Calves normally microcytic up to 1 yr. Cattle regenerate slowly — macrocytosis subtle."},{"part":"CBC","chapter":"Erythrogram (Red Cells)","name":"MCHC / MCH","ref":"300–360 (MCHC)","units":"g/L","high_term":"","low_term":"","increased":"Usually artefact: intravascular hemolysis (free Hb); Heinz bodies; lipemia; marked leucocytosis; agglutination; a \"true\" high MCHC is not physiologically possible","decreased":"Regeneration (young RBC not fully hemoglobinised); iron deficiency (hypochromia); chronic blood loss","notes":"High MCHC is almost always artefact (hemolysis/lipemia/Heinz bodies)."},{"part":"CBC","chapter":"Erythrogram (Red Cells)","name":"RDW (red cell distribution width)","ref":"15–20","units":"%","high_term":"","low_term":"","increased":"Anisocytosis — regeneration (mix of young + old cells); iron deficiency (mix of normal + microcytic); recent transfusion; early response to anemia","decreased":"No diagnostic significance when low","notes":"↑ RDW may flag early regeneration before MCV shifts."},{"part":"CBC","chapter":"Erythrogram (Red Cells)","name":"Reticulocytes","ref":"Rare/absent (adult)","units":"/µL","high_term":"","low_term":"","increased":"Regenerative anemia (hemolysis or blood loss, 3–5 days after onset); the ONLY reliable proof of regeneration; aggregate reticulocytes = active regeneration","decreased":"Non-regenerative anemia (chronic disease, BVD marrow suppression, renal disease, bracken fern toxicity, myelophthisis); pre-regenerative (first 2–4 days of acute loss — too early)","notes":"Basophilic stippling = prominent regeneration marker (also LEAD toxicity — correlate)."},{"part":"CBC","chapter":"Leukogram (White Cells)","name":"Total WBC","ref":"4.0–12.0","units":"×10^9/L","high_term":"Leucocytosis","low_term":"Leucopenia","increased":"inflammation/infection (neutrophilia ± left shift); stress/corticosteroid (mature neutrophilia + lymphopenia + eosinopenia); excitement (physiologic — lymphocytosis, catecholamine); lymphoid leukemia / BLV lymphocytosis; chronic localized infection","decreased":"overwhelming acute infection/endotoxemia (coliform mastitis, metritis, peritonitis, severe salmonellosis) — neutrophils consumed faster than marrow supplies; BVD (marrow/lymphoid suppression); viral infection early; bracken fern toxicity (pancytopenia)","notes":"Small marrow reserve → acute severe infection = NEUTROPENIA."},{"part":"CBC","chapter":"Leukogram (White Cells)","name":"Neutrophils (segmented)","ref":"0.6–4.0","units":"×10^9/L","high_term":"Neutrophilia","low_term":"Neutropenia","increased":"chronic/established inflammation or infection (abscess, TRP, pneumonia, metritis, arthritis); stress/steroid (endogenous cortisol or exogenous — mature cells, no left shift); the cattle N:L ratio normally ~0.5 (LYMPHOCYTES predominate) — so a \"normal\" N:L in cattle looks like stress in a dog","decreased":"acute overwhelming bacterial infection (consumption — endotoxemia, coliform mastitis, acute metritis/peritonitis, severe salmonellosis); endotoxin margination; BVD; bracken fern (marrow damage)","notes":"Early acute infection = neutropenia + left shift; neutrophilia as it recovers."},{"part":"CBC","chapter":"Leukogram (White Cells)","name":"Band (immature) neutrophils","ref":"0 (rare)","units":"×10^9/L","high_term":"","low_term":"","increased":"Left shift = active inflammatory demand: regenerative left shift (neutrophilia + bands, marrow keeping up — good); degenerative left shift (bands ≥ segs ± neutropenia, marrow overwhelmed — GUARDED prognosis, e.g. coliform mastitis, peritonitis, severe metritis); toxic change in neutrophils (Döhle bodies, cytoplasmic basophilia, vacuolation) = severe systemic inflammation/toxemia","decreased":"Not applicable (0 is normal)","notes":"Any bands = inflammatory demand. Bands > segs + toxic change = severe sepsis."},{"part":"CBC","chapter":"Leukogram (White Cells)","name":"Lymphocytes","ref":"2.5–7.5","units":"×10^9/L","high_term":"Lymphocytosis","low_term":"Lymphopenia","increased":"BLV (enzootic bovine leukosis) — persistent lymphocytosis is a hallmark (test for BLV; some progress to lymphoma); chronic antigenic stimulation; excitement/physiologic (catecholamine — transient, esp. young); lymphoid leukemia","decreased":"stress/corticosteroid (VERY common — part of the \"stress leukogram\"); acute viral infection (BVD, early); endotoxemia; loss of lymph (chylothorax, severe GI disease)","notes":"Lymphocytes predominate in healthy cattle. Persistent lymphocytosis → think BLV."},{"part":"CBC","chapter":"Leukogram (White Cells)","name":"Monocytes","ref":"0–0.8","units":"×10^9/L","high_term":"Monocytosis","low_term":"","increased":"chronic inflammation/infection (abscess, TRP, granulomatous disease, chronic pyogenic conditions); tissue necrosis; stress/steroid (mild); often accompanies chronic neutrophilia","decreased":"No diagnostic significance","notes":"Supports chronic/granulomatous process (abscess, TRP)."},{"part":"CBC","chapter":"Leukogram (White Cells)","name":"Eosinophils","ref":"0–2.4","units":"×10^9/L","high_term":"Eosinophilia","low_term":"Eosinopenia","increased":"parasitism (GI nematodes, lungworm, fluke, external parasites); hypersensitivity/allergic disease; mast cell tumor (rare); chronic skin disease","decreased":"stress/corticosteroid (part of the stress leukogram — often more consistent than lymphopenia); acute infection/inflammation","notes":"Eosinophilia = parasitism/hypersensitivity; eosinopenia = stress leukogram."},{"part":"CBC","chapter":"Leukogram (White Cells)","name":"Basophils","ref":"0–0.2","units":"×10^9/L","high_term":"Basophilia","low_term":"","increased":"Often parallels eosinophilia — parasitism, hypersensitivity; rare; usually not independently significant","decreased":"No significance","notes":"Basophilia is uncommon; interpret alongside eosinophils (parasites/allergy)."},{"part":"CBC","chapter":"Platelets & Morphology","name":"Platelets","ref":"200–800","units":"×10^9/L","high_term":"Thrombocytosis","low_term":"Thrombocytopenia","increased":"reactive (inflammation, chronic blood loss/iron deficiency, recovery from marrow suppression); splenic contraction; post-exercise; rarely essential (myeloproliferative — very rare)","decreased":"Consumption: DIC (with schistocytes, prolonged PT/aPTT, ↓fibrinogen, ↑D-dimer); acute severe inflammation/sepsis; Destruction: immune-mediated (rare, e.g. post-viral, BVD); Decreased production: BVD (marrow suppression — important!), bracken fern toxicity (pancytopenia, thrombocytopenia — bleeding), trichloroethylene-extracted feed, myelophthisis (lymphoma); Sequestration/loss: severe hemorrhage","notes":"Marked thrombocytopenia (<40) → bleeding risk. Key: BVD, bracken, DIC, sepsis."},{"part":"CBC","chapter":"Platelets & Morphology","name":"Plasma protein (refractometer TP)","ref":"67–75","units":"g/L","high_term":"","low_term":"","increased":"Dehydration (with ↑PCV); chronic inflammation (↑globulins); see full Proteins chapter","decreased":"Blood loss (with ↓PCV); protein-losing states; overhydration; see full Proteins chapter","notes":"Fastest triage: PCV↑/TP↑ = dehydration; PCV↓/TP↓ = blood loss;"},{"part":"Chemistry","chapter":"Proteins & Ratios","name":"Total Protein (TP)","ref":"67–75","units":"g/L","high_term":"Hyperproteinemia","low_term":"Hypoproteinemia","increased":"Dehydration (most common — hemoconcentration; check PCV/albumin together); Chronic inflammation/infection (↑globulins — e.g. abscess, TRP, peritonitis); Chronic antigenic stimulation (Johne, BLV, chronic parasitism); Lymphoma / plasma-cell tumors (monoclonal gammopathy — rare)","decreased":"Overhydration (dilutional — IV fluids); Protein-losing enteropathy (Johne disease, severe parasitism — Ostertagia); Protein-losing nephropathy (glomerulonephritis, amyloidosis); Liver failure (↓albumin synthesis); Severe hemorrhage / exudative loss (burns, effusion); Malnutrition / chronic starvation","notes":"Never read TP alone — always with PCV, albumin & globulins to localize."},{"part":"Chemistry","chapter":"Proteins & Ratios","name":"Albumin","ref":"30–39","units":"g/L","high_term":"Hyperalbuminemia","low_term":"Hypoalbuminemia","increased":"Dehydration ONLY (albumin is NOT a positive acute-phase protein in cattle — a true rise means hemoconcentration)","decreased":"Negative acute-phase response (inflammation → liver diverts synthesis — most common cause of mild hypoalbuminemia); Liver failure (↓synthesis — chronic; >60–80% loss of function); Protein-losing enteropathy (Johne, parasitism — lose albumin + globulin); Protein-losing nephropathy (glomerular — lose albumin > globulin); Malnutrition / negative energy balance; Chronic blood loss (hemorrhage, heavy lice/fluke burden)","notes":"Albumin has a LONG half-life (~16 days in cattle) — hypoalbuminemia = chronic process."},{"part":"Chemistry","chapter":"Proteins & Ratios","name":"Globulins (calculated: TP − Albumin)","ref":"28–40","units":"g/L","high_term":"Hyperglobulinemia","low_term":"Hypoglobulinemia","increased":"Chronic inflammation/infection (polyclonal — ↑α, β, γ globulins); Abscess (liver, TRP), peritonitis, chronic pneumonia; Chronic parasitism; Johne disease; BLV/lymphoma; Monoclonal gammopathy (rare — lymphoma, plasma cell tumor); FPT-recovered calf with active infection","decreased":"Failure of passive transfer (FPT) in neonates (low IgG — see Neonatal section; measure <10 g/L globulins or TP <52 g/L at 24–48h); Protein-losing enteropathy/nephropathy (lose all proteins); Severe hemorrhage; immunodeficiency (rare)","notes":"High globulin + low albumin (low A:G) = chronic inflammation."},{"part":"Chemistry","chapter":"Proteins & Ratios","name":"Albumin:Globulin Ratio (A:G)","ref":"0.84–1.0","units":"ratio","high_term":"","low_term":"","increased":"High A:G (relative ↑albumin or ↓globulin): FPT in calves (low globulin); Selective globulin loss is rare — usually A:G rises because globulins fall; Overhydration affects both proportionally (ratio often unchanged)","decreased":"Low A:G — the KEY inflammatory pattern: ↓albumin (negative APP) + ↑globulin (chronic antigenic stimulation); Chronic infection/inflammation (abscess, Johne, peritonitis, TRP); Also low if albumin lost selectively (glomerulonephritis) with normal globulin; Liver failure (↓albumin, globulin may rise from ↓clearance)","notes":"A:G ratio is often MORE informative than TP alone."},{"part":"Chemistry","chapter":"Proteins & Ratios","name":"Fibrinogen","ref":"3–7","units":"g/L","high_term":"Hyperfibrinogenemia","low_term":"Hypofibrinogenemia","increased":"Positive acute-phase protein (rises in 24–48h — inflammation/infection); Any active bacterial infection (pneumonia, metritis, peritonitis, TRP); Tissue damage / surgery / trauma; Best combined with TP as the \"Plasma Protein:Fibrinogen ratio\"","decreased":"DIC (consumption — with thrombocytopenia + prolonged clotting times); Severe liver failure (↓synthesis); Rarely congenital","notes":"P:F ratio 15 = dehydration raised the TP."},{"part":"Chemistry","chapter":"Liver","name":"GGT (gamma-glutamyl transferase)","ref":"6.1–17.4","units":"U/L","high_term":"","low_term":"","increased":"Cholestasis / biliary hyperplasia (the KEY bovine cholestatic enzyme): bile duct obstruction (fluke — Fasciola hepatica; cholangitis; cholelithiasis); fatty liver (hepatic lipidosis — periparturient); hepatic abscess; cholangiohepatitis; plant/mycotoxin hepatotoxicity (pyrrolizidine alkaloids — Senecio/ragwort, Heliotropium; lupinosis; sporidesmin/facial eczema; aflatoxin); neonate: colostrum ingestion transiently ↑ GGT (normal in first days)","decreased":"No diagnostic significance","notes":"Most useful bovine liver enzyme — marks cholestasis/biliary hyperplasia."},{"part":"Chemistry","chapter":"Liver","name":"GLDH / GDH (glutamate dehydrogenase)","ref":"8–41","units":"U/L","high_term":"","low_term":"","increased":"Acute hepatocellular injury (the KEY bovine hepatocellular enzyme): hepatic lipidosis (fatty liver); acute hepatotoxicity (pyrrolizidine alkaloids, aflatoxin, blue-green algae, copper, phosphorus); hepatic necrosis; acute cholangiohepatitis; hypoxia/anemia; endotoxemia; fluke migration (acute phase)","decreased":"No diagnostic significance","notes":"Best marker of ACUTE hepatocellular damage (ALT is useless in ruminants)."},{"part":"Chemistry","chapter":"Liver","name":"AST (aspartate aminotransferase)","ref":"78–132","units":"U/L","high_term":"","low_term":"","increased":"NOT liver-specific — also muscle. Hepatocellular injury (fatty liver, toxic, necrosis); MUSCLE damage (trauma, recumbency, injection, white muscle disease, exertion); hemolysis (artefactual — released from RBC); always interpret with CK (muscle) and GLDH/GGT (liver) to localize","decreased":"No diagnostic significance","notes":"Not liver-specific. AST↑ + CK↑ = muscle; AST↑ + CK normal + GLDH/GGT↑ = liver."},{"part":"Chemistry","chapter":"Liver","name":"SDH (sorbitol dehydrogenase)","ref":"4.3–15.3","units":"U/L","high_term":"","low_term":"","increased":"Acute hepatocellular injury (liver-specific, like GLDH); same causes as GLDH — fatty liver, toxic hepatopathy, necrosis","decreased":"No diagnostic significance","notes":"Liver-specific but unstable in vitro — assay fast; prefer GLDH if transport delayed."},{"part":"Chemistry","chapter":"Liver","name":"Total Bilirubin","ref":"0.7–14","units":"µmol/L","high_term":"Hyperbilirubinemia","low_term":"","increased":"Pre-hepatic (hemolysis): ↑ unconjugated (indirect) — babesiosis (intravascular + hemoglobinuria), anaplasmosis (extravascular, icterus but NO hemoglobinuria), theileriosis, mycoplasma; bacillary hemoglobinuria, leptospirosis (Pomona — calves), copper toxicity, post-parturient hemoglobinuria; Hepatic: hepatocellular disease (fatty liver, toxic); Post-hepatic (cholestasis): ↑ conjugated (direct) — bile duct obstruction (fluke, cholelithiasis), cholangitis; ANOREXIA/fasting (very important in cattle): ↑ unconjugated bilirubin from reduced hepatic uptake — a PHYSIOLOGIC rise, not liver disease","decreased":"No diagnostic significance","notes":"Anorexia alone raises (unconjugated) bilirubin — don't over-read in an off-feed cow."},{"part":"Chemistry","chapter":"Liver","name":"Bile Acids (total serum)","ref":"<100 (variable)","units":"µmol/L","high_term":"","low_term":"","increased":"Reduced hepatic function/mass (end-stage liver disease, cirrhosis, fibrosis); cholestasis (obstruction); portosystemic shunt (rare in cattle); reduced functional hepatic mass from any chronic hepatopathy","decreased":"No diagnostic significance","notes":"Assess functional hepatic mass (vs enzymes = damage). Supportive only in cattle."},{"part":"Chemistry","chapter":"Liver","name":"ALP (alkaline phosphatase)","ref":"0–488 (wide, age-dependent)","units":"U/L","high_term":"","low_term":"","increased":"Poorly liver-specific in cattle (bone, intestine, placenta isoenzymes); young growing animals (bone ALP — physiologically high); cholestasis (less reliable than GGT in cattle); pregnancy; healing fracture / osteoblastic activity","decreased":"No diagnostic significance","notes":"ALP is much LESS useful in cattle than in dogs — wide reference range,"},{"part":"Chemistry","chapter":"Kidney","name":"Urea (BUN)","ref":"2.1–10.7","units":"mmol/L","high_term":"Azotemia (uremia)","low_term":"","increased":"Pre-renal: dehydration/hypovolemia (reduced GFR — most common); shock, heart failure; high protein intake; GI hemorrhage (protein load); catabolizm (fever, starvation, exertion); Renal: renal failure (pyelonephritis, nephrosis, amyloidosis, toxic — oak/acorn, oxalate, aminoglycosides, NSAIDs, heavy metals); Post-renal: urinary obstruction (urolithiasis — esp. steers/bulls), ruptured bladder (uroperitoneum — calves)","decreased":"Reduced hepatic synthesis (end-stage liver failure); low protein diet; anabolic state; severe PU/PD / over-hydration (dilution); young growing animals (physiologic)","notes":"Diet/rumen-affected — creatinine is the more reliable GFR marker."},{"part":"Chemistry","chapter":"Kidney","name":"Creatinine","ref":"45–130","units":"µmol/L","high_term":"Azotemia","low_term":"","increased":"Pre-renal: dehydration, hypovolemia, shock (reduced GFR); Renal: ≥75% nephron loss (azotemia appears late — insensitive early); pyelonephritis, nephrosis, amyloidosis, toxic nephropathy, congenital; Post-renal: obstruction (urolithiasis), ruptured bladder (uroperitoneum — creatinine in abdominal fluid > serum, ratio >2:1); marked muscle mass / severe rhabdomyolysis (minor contribution)","decreased":"Reduced muscle mass (cachexia, chronic disease); young/small animals; over-hydration; pregnancy (mild dilutional)","notes":"Azotemia is LATE (≥75% nephrons lost). Pair with USG: concentrated = pre-renal,"},{"part":"Chemistry","chapter":"Kidney","name":"Urine Specific Gravity (USG)","ref":"1.020–1.045","units":"","high_term":"","low_term":"","increased":"Pre-renal azotemia (kidney concentrating appropriately — GOOD); dehydration with intact renal function; glucosuria/proteinuria (osmotic contribution)","decreased":"Renal failure (loss of concentrating ability — isosthenuria 1.008–1.012); medullary washout; diabetes insipidus (rare); PU/PD; over-hydration; diuretics","notes":"Azotemia + concentrated urine (>1.025) = pre-renal; + isosthenuria = renal."},{"part":"Chemistry","chapter":"Kidney","name":"Phosphate (in renal context)","ref":"1.4–2.5","units":"mmol/L","high_term":"","low_term":"","increased":"Renal failure (reduced excretion — with azotemia); post-renal obstruction/uroperitoneum; young growing animals (physiologically higher); downer cow / tissue damage; vitamin D toxicity","decreased":"Post-parturient hemoglobinuria (hypophosphatemia); anorexia/starvation; hyperparathyroidism; malabsorption; \"downer cow\" (variable)","notes":"↑ in renal failure. Marked ↓ → post-parturient hemoglobinuria (fresh dairy cow)."},{"part":"Chemistry","chapter":"Muscle","name":"CK (creatine kinase)","ref":"4.8–12.1","units":"U/L (×100)","high_term":"","low_term":"","increased":"Muscle damage (highly muscle-specific): recumbency / downer cow (pressure myopathy — rises fast, huge values); trauma, IM injection, transport, struggling/restraint; nutritional myopathy (white muscle disease — selenium/vitamin E deficiency); exertional rhabdomyolysis; myositis (clostridial — blackleg/malignant edema); seizures, prolonged lateral recumbency (anesthesia)","decreased":"No diagnostic significance","notes":"Muscle-specific, rises/falls fast — high CK = recent damage."},{"part":"Chemistry","chapter":"Muscle","name":"AST (muscle context)","ref":"78–132","units":"U/L","high_term":"","low_term":"","increased":"Muscle damage (parallels CK but NOT specific — also liver); rises slower than CK, peaks ~24–48h, persists days (longer half-life); see Liver chapter for hepatic causes","decreased":"No diagnostic significance","notes":"Timing: CK↑/AST normal = <12h; CK↑/AST↑ = recent; CK normal/AST↑ = older, resolving."},{"part":"Chemistry","chapter":"Muscle","name":"Cardiac Troponin I (cTnI)","ref":"<0.05 (low)","units":"ng/mL","high_term":"","low_term":"","increased":"Cardiac muscle injury (highly cardiac-specific): traumatic reticulopericarditis (hardware → myocardial damage); white muscle disease (cardiac form — calves); myocarditis (Histophilus, FMD, other); monensin/ionophore toxicity; endotoxemia/sepsis (myocardial depression); severe metabolic/electrolyte disturbance","decreased":"No diagnostic significance","notes":"Cardiac-specific (unlike CK/AST). Confirms myocardial injury — rising cTnI = worse prognosis."},{"part":"Chemistry","chapter":"Electrolytes & Acid-Base","name":"Sodium (Na+)","ref":"135–151","units":"mmol/L","high_term":"Hypernatremia","low_term":"Hyponatremia","increased":"water deprivation (no access, frozen/empty trough); salt poisoning / water intoxication sequence; excess salt intake with limited water; diabetes insipidus (rare); severe watery diarrhea (free water loss > Na loss)","decreased":"GI loss (diarrhea, sequestration — abomasal volvulus/displacement, ileus); renal loss; uroperitoneum (Na into abdomen); excessive sweating (rare cattle); third-spacing (peritonitis, effusion); over-hydration with hypotonic fluid","notes":"Correct slowly — rapid correction risks CNS injury (cerebral edema)."},{"part":"Chemistry","chapter":"Electrolytes & Acid-Base","name":"Potassium (K+)","ref":"3.9–5.8","units":"mmol/L","high_term":"Hyperkalemia","low_term":"Hypokalemia","increased":"uroperitoneum (ruptured bladder — calf); post-renal obstruction; acute renal failure (oliguria/anuria); severe acidosis (K+ shifts out of cells); massive tissue/muscle necrosis; adrenal insufficiency (rare); ARTEFACT — hemolysis, delayed serum separation, thrombocytosis","decreased":"Common in sick, anorexic cattle: anorexia (reduced intake — cattle depend on continuous intake); GI/abomasal loss (reflux, displacement, ileus — with alkalosis); alkalosis (K+ shifts into cells); excessive glucose/insulin or catecholamines; chronic diarrhea; iatrogenic (isotonic fluids without K)","notes":"Anorexia is the top cause of ↓K in cattle. Exclude hemolysis before believing ↑K."},{"part":"Chemistry","chapter":"Electrolytes & Acid-Base","name":"Chloride (Cl-)","ref":"95–110","units":"mmol/L","high_term":"Hyperchloremia","low_term":"Hypochloremia","increased":"water deprivation / salt toxicity; usually parallels Na; renal tubular acidosis; total body water deficit","decreased":"Very important in cattle: abomasal outflow disruption — abomasal volvulus, LDA/RDA, vagal indigestion (HCl sequestered in abomasum → hypochloremic, hypokalemic metabolic ALKALOSIS); reflux, high GI obstruction; vomiting (rare in cattle)","notes":"↓ Cl = hallmark of abomasal disease (hypochloremic hypokalemic metabolic alkalosis)."},{"part":"Chemistry","chapter":"Electrolytes & Acid-Base","name":"Bicarbonate (HCO3-) / TCO2","ref":"20–30","units":"mmol/L","high_term":"","low_term":"","increased":"Metabolic alkalosis: abomasal disorders (volvulus, displacement, vagal indigestion — sequestered HCl); high GI obstruction; hypochloremia/hypokalemia","decreased":"Metabolic acidosis: grain overload / ruminal lactic acidosis (SARA/acute); diarrhea (bicarbonate loss — calf scours); renal failure; ketoacidosis; shock/hypoperfusion (lactic acidosis); ethylene glycol/salicylate (rare)","notes":"Two pictures: acidosis (grain overload, scours, shock) vs alkalosis (abomasal disease)."},{"part":"Chemistry","chapter":"Electrolytes & Acid-Base","name":"Anion Gap [Na+K] - [Cl+HCO3]","ref":"14–26","units":"mmol/L","high_term":"","low_term":"","increased":"High AG metabolic acidosis (added acid): lactic acidosis (grain overload, shock/hypoperfusion, ruminal acidosis); ketoacidosis; renal failure (retained acids); ethylene glycol, salicylate","decreased":"Hypoalbuminemia (albumin is main unmeasured anion — low albumin lowers AG); rarely lab error","notes":"High AG = added acids (lactate, ketones, uremia); normal-AG acidosis = HCO3 loss."},{"part":"Chemistry","chapter":"Minerals (Ca, P, Mg)","name":"Calcium (total)","ref":"2.1–2.8","units":"mmol/L","high_term":"Hypercalcemia","low_term":"Hypocalcemia","increased":"Uncommon in cattle: vitamin D toxicosis (excess supplement, calcinogenic plants — Cestrum, Solanum, Trisetum); chronic renal disease (variable); pseudohyperparathyroidism / lymphoma (rare); artefact (lipemia, prolonged stasis)","decreased":"VERY common: Milk fever / parturient paresis (periparturient dairy cow — recumbent, cold, flaccid, tachycardia, S-bend neck); downer cow; grass tetany (concurrent with low Mg); acute mastitis/metritis endotoxemia (Ca sequestration); malabsorption; oxalate toxicity; alkalosis (↓ ionized Ca); anorexia; late pregnancy","notes":"Albumin-dependent — prefer ionized Ca. Milk fever: Ca often <1.5. Alkalosis lowers ionized Ca."},{"part":"Chemistry","chapter":"Minerals (Ca, P, Mg)","name":"Phosphate (inorganic)","ref":"1.4–2.5","units":"mmol/L","high_term":"Hyperphosphatemia","low_term":"Hypophosphatemia","increased":"renal failure (reduced excretion); post-renal obstruction/uroperitoneum; young growing animals (physiologic, higher); vitamin D toxicity; tissue/muscle necrosis; hemolysis (artefact)","decreased":"Post-parturient hemoglobinuria (fresh high-yield dairy cow — intravascular hemolysis + hemoglobinuria + severe hypophosphatemia); \"downer cow\" (variable); anorexia/starvation; primary hyperparathyroidism (rare); malabsorption; prolonged inappetence","notes":"↓↓ P + red urine in fresh cow → post-parturient hemoglobinuria. Often low in downers too."},{"part":"Chemistry","chapter":"Minerals (Ca, P, Mg)","name":"Magnesium (Mg)","ref":"0.75–1.0","units":"mmol/L","high_term":"Hypermagnesemia","low_term":"Hypomagnesemia","increased":"Uncommon: excess Mg supplementation; renal failure (reduced excretion); usually iatrogenic","decreased":"Grass tetany / grass staggers (lush spring pasture low in Mg, high K/N — hyperexcitability, tetany, convulsions, sudden death); lactation tetany; transport/starvation tetany; reduced intake/absorption; concurrent with hypocalcemia; winter tetany (poor forage)","notes":"Grass tetany = acute ↓Mg (± ↓Ca) — neuro emergency. Treat Mg + Ca, SLOW IV."},{"part":"Chemistry","chapter":"Energy Metabolism","name":"Glucose","ref":"2.5–4.2","units":"mmol/L","high_term":"Hyperglycemia","low_term":"Hypoglycemia","increased":"stress/catecholamine (excitement, handling, pain — transient, common); corticosteroids (endogenous/exogenous); xylazine/alpha-2 sedation (marked, transient); diabetes mellitus (very rare cattle); acute-phase / endotoxemia (early); late/severe milk fever (variable)","decreased":"Ketosis / negative energy balance (early-lactation dairy cow); Pregnancy toxemia (late-gestation beef cow/ewe with twins); starvation/anorexia; neonatal hypoglycemia (septic/hypothermic calf); severe endotoxemia/sepsis (late — consumption); liver failure; artefact (delayed separation — RBC glycolysis, use fluoride tube)","notes":"Falls ~5–10%/hr in un-separated blood — use fluoride tube. Stress ↑ is common; pair with BHB/NEFA."},{"part":"Chemistry","chapter":"Energy Metabolism","name":"BHB (beta-hydroxybutyrate)","ref":"<1.0 (subclinical 1.0–1.4)","units":"mmol/L","high_term":"Ketonemia / ketosis","low_term":"","increased":"Key transition-cow test: clinical ketosis (BHB >2.6–3.0) — early-lactation NEB, off feed, drop in milk; subclinical ketosis (BHB 1.2–2.9) — herd-level fertility/production loss; pregnancy toxemia (late gestation, twins); secondary to any off-feed disease (LDA, metritis, mastitis); starvation/underfeeding","decreased":"No diagnostic significance","notes":"Gold-standard ketone (cow-side). Subclinical ≥1.2, clinical >2.6–3.0."},{"part":"Chemistry","chapter":"Energy Metabolism","name":"NEFA (non-esterified fatty acids)","ref":"<0.4 (pre-partum)","units":"mmol/L","high_term":"","low_term":"","increased":"Negative energy balance / fat mobilization: transition-cow NEB (pre- and post-partum); ketosis; pregnancy toxemia; fatty liver (hepatic lipidosis); anorexia/underfeeding; any off-feed disease; over-conditioned cows at calving (excessive mobilization)","decreased":"No diagnostic significance","notes":"Early NEB marker (rises before BHB). Pre-partum >0.3–0.4, post-partum >0.6–0.7 = risk."},{"part":"Chemistry","chapter":"Energy Metabolism","name":"Triglycerides","ref":"0.07–0.43","units":"mmol/L","high_term":"Hypertriglyceridemia","low_term":"","increased":"Recent feeding (post-prandial); severe negative energy balance with fat mobilization (variable); cholestasis; lipemic sample (artefact affecting other assays)","decreased":"Prolonged anorexia/starvation; severe hepatic lipidosis (impaired VLDL export — low circulating TG despite fatty liver; cattle have limited hepatic lipoprotein export)","notes":"Limited VLDL export → fat accumulates in liver. Serum TG is a poor fatty-liver marker."},{"part":"Chemistry","chapter":"Energy Metabolism","name":"Cholesterol","ref":"2.0–4.5 (lactation-dependent)","units":"mmol/L","high_term":"Hypercholesterolemia","low_term":"Hypocholesterolemia","increased":"High plane of nutrition / peak lactation (physiologic); cholestasis; high-fat ration","decreased":"Negative energy balance / anorexia; hepatic insufficiency (↓ synthesis); malabsorption / maldigestion; early lactation NEB","notes":"Tracks nutrition/lactation. Low → hepatic insufficiency or severe NEB (non-specific)."},{"part":"Chemistry","chapter":"Acute-Phase Proteins","name":"Haptoglobin","ref":"<0.1 (healthy)","units":"g/L","high_term":"","low_term":"","increased":"Major positive acute-phase protein in cattle: acute bacterial infection (mastitis, metritis, pneumonia, peritonitis, traumatic reticuloperitonitis); inflammation/tissue damage (surgery, trauma); endotoxemia; abscessation; higher/more sustained rise = more severe/active inflammation","decreased":"Intravascular hemolysis (haptoglobin binds free Hb and is cleared — so hemolysis LOWERS measurable haptoglobin); healthy baseline (normally very low/undetectable)","notes":"Principal bovine acute-phase protein. Detects subclinical disease + grades severity."},{"part":"Chemistry","chapter":"Acute-Phase Proteins","name":"Serum Amyloid A (SAA)","ref":"<20 (healthy)","units":"mg/L","high_term":"","low_term":"","increased":"Acute inflammation/infection (rises FAST — within hours, earlier than haptoglobin); mastitis, metritis, respiratory disease, endotoxemia; surgery/trauma; viral infection (responds more than haptoglobin to some viruses); good early marker of acute-phase response","decreased":"Healthy baseline (low); resolution of inflammation","notes":"Rises faster than haptoglobin (hours) — best for very early/resolving inflammation."},{"part":"Chemistry","chapter":"Acute-Phase Proteins","name":"Fibrinogen (acute-phase view)","ref":"3–7","units":"g/L","high_term":"","low_term":"","increased":"Positive acute-phase protein (slower — 24–48h); any active inflammation/infection; best used with TP as Plasma-protein:Fibrinogen (P:F) ratio","decreased":"DIC (consumption); severe liver failure (↓ synthesis)","notes":"P:F 15 = dehydration. Slower than haptoglobin/SAA but accessible."},{"part":"Chemistry","chapter":"Endocrine & Misc","name":"Cortisol","ref":"Variable (stress-dependent)","units":"nmol/L","high_term":"","low_term":"","increased":"Stress/pain/handling (endogenous release — transient); exogenous corticosteroid effect; chronic disease; transport, parturition, disease states","decreased":"Adrenal insufficiency (very rare in cattle); exogenous steroid suppression of axis","notes":"Rarely useful (pulsatile, stress-driven). Stress leukogram is a better steroid marker."},{"part":"Chemistry","chapter":"Endocrine & Misc","name":"Thyroxine (T4) / thyroid","ref":"Breed/age variable","units":"nmol/L","high_term":"","low_term":"","increased":"Rare; laboratory/assay variation","decreased":"Iodine deficiency (goiter — endemic areas, goitrogenic plants); non-thyroidal illness (euthyroid sick — low T4 with systemic disease); selenium deficiency (affects deiodination)","notes":"Rarely tested. Main concern: congenital goiter (iodine deficiency). Sick cattle: low T4 without true hypothyroidism."},{"part":"Chemistry","chapter":"Endocrine & Misc","name":"Insulin / glucose dynamics","ref":"Research/specialist","units":"","high_term":"","low_term":"","increased":"Over-conditioned cattle (insulin resistance in transition period); high-grain diets","decreased":"Pancreatic dysfunction (rare); severe negative energy balance","notes":"Rarely measured in the field. Transition-cow insulin resistance → fatty liver/ketosis risk."},{"part":"Chemistry","chapter":"Endocrine & Misc","name":"Copper (Cu)","ref":"9.4–19","units":"µmol/L","high_term":"","low_term":"","increased":"Copper toxicity: chronic accumulation then hemolytic crisis (sheep > cattle, but cattle affected) — ↑↑ during crisis with intravascular hemolysis, hemoglobinuria, icterus; excess supplementation; grazing high-Cu/low-Mo pasture","decreased":"Copper deficiency: primary (low-Cu soils) or secondary (high molybdenum/sulfur/iron — antagonists); ill-thrift, poor growth, faded/rough coat (achromotrichia), diarrhea, anemia, enzootic ataxia in calves (swayback), fragile bones","notes":"Liver Cu is gold standard (serum insensitive). Deficiency often 2° to Mo/S excess."},{"part":"Chemistry","chapter":"Endocrine & Misc","name":"Selenium / GSH-Px","ref":"Lab-specific","units":"","high_term":"","low_term":"","increased":"Selenium toxicity (rare — seleniferous plants/over-supplementation)","decreased":"Selenium/vitamin E deficiency — white muscle disease (calves: cardiac sudden death or skeletal weakness), ill-thrift, retained placenta, immune dysfunction","notes":"GSH-Px = practical selenium proxy. Deficiency → white muscle disease + repro/immune problems."},{"part":"Chemistry","chapter":"Endocrine & Misc","name":"Iron / ferritin","ref":"Not routine","units":"","high_term":"","low_term":"","increased":"Hemolysis (release); repeated transfusion; hepatopathy","decreased":"Chronic blood loss (abomasal ulcer, parasitism, lice — iron-deficiency anemia, microcytic); milk-fed calves (low dietary iron — veal anemia); anemia of chronic disease (iron sequestered)","notes":"Microcytic anemia + chronic blood loss = iron deficiency; milk-fed calves classic."}],"patterns":[{"title":"PROTEIN PATTERNS","items":[{"name":"Chronic inflammation / infection","desc":"↓ Albumin + ↑ Globulin → LOW A:G ratio. ↑ Fibrinogen, low P:F ratio. The classic \"sick chronic cow\" signature — hunt for a focus (abscess, TRP, peritonitis, Johne, chronic pneumonia).","s":{"finding":"↓ Albumin + ↑ Globulin → LOW A:G ratio","points":[{"label":"","text":"↑ Fibrinogen, low P:F ratio"},{"label":"","text":"The classic \"sick chronic cow\" signature — hunt for a focus (abscess, TRP, peritonitis, Johne, chronic pneumonia)"}],"key":""}},{"name":"Dehydration (hemoconcentration)","desc":"↑ TP + ↑ Albumin + ↑ PCV together, PROPORTIONALLY. A:G ratio usually unchanged. High P:F ratio (>15). Confirm with clinical hydration status.","s":{"finding":"↑ TP + ↑ Albumin + ↑ PCV together, PROPORTIONALLY","points":[{"label":"","text":"A:G ratio usually unchanged"},{"label":"","text":"High P:F ratio (>15)"},{"label":"","text":"Confirm with clinical hydration status"}],"key":""}},{"name":"Failure of passive transfer (FPT) — neonate","desc":"Low globulin (↓ IgG) with normal/low albumin → HIGH A:G ratio. TP <52 g/L or globulins <10 g/L at 24–48h. Calf at high risk of sepsis.","s":{"finding":"Low globulin (↓ IgG) with normal/low albumin → HIGH A:G ratio","points":[{"label":"","text":"TP <52 g/L or globulins <10 g/L at 24–48h"},{"label":"","text":"Calf at high risk of sepsis"}],"key":""}},{"name":"Protein-losing enteropathy (e.g. Johne)","desc":"↓ Albumin AND ↓ Globulin together (panhypoproteinemia) → A:G often normal. GI losses = both fractions lost. Look for weight loss + diarrhea.","s":{"finding":"↓ Albumin AND ↓ Globulin together (panhypoproteinemia) → A:G often normal","points":[{"label":"","text":"GI losses = both fractions lost"},{"label":"","text":"Look for weight loss + diarrhea"}],"key":""}},{"name":"Protein-losing nephropathy (glomerular)","desc":"↓ Albumin with normal/near-normal globulin → LOW A:G. Selective albumin loss through damaged glomerulus. Confirm with proteinuria (UPC).","s":{"finding":"↓ Albumin with normal/near-normal globulin → LOW A:G","points":[{"label":"","text":"Selective albumin loss through damaged glomerulus"},{"label":"","text":"Confirm with proteinuria (UPC)"}],"key":""}},{"name":"Liver failure","desc":"↓ Albumin (↓ synthesis) ± normal/↑ globulin. Chronic — >60–80% function lost. Cross-check with liver enzymes + bile acids.","s":{"finding":"↓ Albumin (↓ synthesis) ± normal/↑ globulin","points":[{"label":"","text":"Chronic — >60–80% function lost"},{"label":"","text":"Cross-check with liver enzymes + bile acids"}],"key":""}}]},{"title":"ANEMIA — classification","items":[{"name":"STEP 1 — Regenerative or not?","desc":"Reticulocytes present + polychromasia + basophilic stippling + anisocytosis (↑RDW) = REGENERATIVE (blood loss or hemolysis). No reticulocytes after 4–5 days = NON-REGENERATIVE (↓ production). Remember cattle regenerate weakly/slowly — give it 3–5 days.","s":{"finding":"Reticulocytes present + polychromasia + basophilic stippling + anisocytosis (↑RDW) = REGENERATIVE (blood loss or hemolysis)","points":[{"label":"","text":"No reticulocytes after 4–5 days = NON-REGENERATIVE (↓ production)"},{"label":"","text":"Remember cattle regenerate weakly/slowly — give it 3–5 days"}],"key":""}},{"name":"Regenerative + ↓TP","desc":"BLOOD LOSS (external or internal). Sources: abomasal ulcer, GI parasites (Hemonchus, Ostertagia), lice, fluke, ticks, coagulopathy (bracken, sweet clover, warfarin, DIC), trauma, ruptured vessel/tumor.","s":{"finding":"BLOOD LOSS (external or internal)","points":[{"label":"Sources","items":["abomasal ulcer","GI parasites (Hemonchus, Ostertagia)","lice","fluke","ticks","coagulopathy (bracken, sweet clover, warfarin, DIC)","trauma","ruptured vessel/tumor"]}],"key":""}},{"name":"Regenerative + normal/↑TP","desc":"HEMOLYSIS. Intravascular (hemoglobinuria): babesiosis, bacillary hemoglobinuria (Cl. hemolyticum), chronic copper toxicity, post-parturient hemoglobinuria, water intoxication (calves), leptospirosis. Extravascular (icterus, no hemoglobinuria): anaplasmosis, mycoplasma (Eperythrozoon), theileriosis.","s":{"finding":"HEMOLYSIS","points":[{"label":"Intravascular (hemoglobinuria)","items":["babesiosis","bacillary hemoglobinuria (Cl. hemolyticum)","chronic copper toxicity","post-parturient hemoglobinuria","water intoxication (calves)","leptospirosis"]},{"label":"Extravascular (icterus, no hemoglobinuria)","items":["anaplasmosis","mycoplasma (Eperythrozoon)","theileriosis"]}],"key":""}},{"name":"Non-regenerative","desc":"Anemia of chronic/inflammatory disease (most common — mild, normocytic normochromic); BVD (marrow suppression); chronic renal disease (↓EPO); bracken fern (aplastic); myelophthisis (lymphoma infiltrating marrow); iron deficiency (chronic — becomes microcytic).","s":{"finding":"","points":[{"label":"","items":["Anemia of chronic/inflammatory disease (most common — mild, normocytic normochromic)","BVD (marrow suppression)","chronic renal disease (↓EPO)","bracken fern (aplastic)","myelophthisis (lymphoma infiltrating marrow)","iron deficiency (chronic — becomes microcytic)"]}],"key":""}},{"name":"Icterus present?","desc":"Pre-hepatic (hemolysis — ↑ unconjugated bilirubin) vs hepatic/cholestatic (↑ conjugated + ↑GGT). Check bilirubin fractions + liver enzymes. Anorexia alone raises bilirubin in cattle (physiologic — don't over-read).","s":{"finding":"Pre-hepatic (hemolysis — ↑ unconjugated bilirubin) vs hepatic/cholestatic (↑ conjugated + ↑GGT)","points":[{"label":"","text":"Check bilirubin fractions + liver enzymes"},{"label":"","text":"Anorexia alone raises bilirubin in cattle (physiologic — don't over-read)"}],"key":""}}]},{"title":"HEMOLYTIC ANEMIA — tick-borne","items":[{"name":"Babesiosis (redwater) — Babesia bovis / B. bigemina","desc":"INTRAvascular hemolysis → HEMOGLOBINURIA (red-brown urine) + fever + icterus + anemia. Tick-transmitted (Rhipicephalus). Intra-erythrocytic piroplasms on smear. B. bovis → also cerebral/neuro signs. Key: red urine (Hb) present.","s":{"finding":"INTRAvascular hemolysis → HEMOGLOBINURIA (red-brown urine) + fever + icterus + anemia","points":[{"label":"","text":"Tick-transmitted (Rhipicephalus)"},{"label":"","text":"Intra-erythrocytic piroplasms on smear"},{"label":"","text":"B. bovis → also cerebral/neuro signs"}],"key":"red urine (Hb) present"}},{"name":"Anaplasmosis — Anaplasma marginale","desc":"EXTRAvascular hemolysis → icterus + anemia but NO hemoglobinuria (urine NORMAL color). Older cattle more severe. Marginal inclusion bodies on smear. Tick- and mechanically-transmitted. Key: icterus WITHOUT red urine.","s":{"finding":"EXTRAvascular hemolysis → icterus + anemia but NO hemoglobinuria (urine NORMAL color)","points":[{"label":"","text":"Older cattle more severe"},{"label":"","text":"Marginal inclusion bodies on smear"},{"label":"","text":"Tick- and mechanically-transmitted"}],"key":"icterus WITHOUT red urine"}},{"name":"Theileriosis — Theileria (annulata/orientalis)","desc":"Endemic Middle East / Mediterranean / Asia. Anemia + fever + lymphadenopathy (T. annulata — tropical theileriosis). Tick-transmitted. Piroplasms in RBC; schizonts in lymphocytes. Regionally important — do not overlook.","s":{"finding":"Endemic Middle East / Mediterranean / Asia","points":[{"label":"","text":"Anemia + fever + lymphadenopathy (T. annulata — tropical theileriosis)"},{"label":"","text":"Tick-transmitted"},{"label":"","text":"Piroplasms in RBC; schizonts in lymphocytes"},{"label":"","text":"Regionally important — do not overlook"}],"key":""}},{"name":"Mycoplasma wenyonii (Eperythrozoon)","desc":"Epicellular RBC organism → usually mild extravascular hemolysis; often subclinical, worse with stress/immunosuppression. ± hindlimb/scrotal edema.","s":{"finding":"Epicellular RBC organism → usually mild extravascular hemolysis; often subclinical, worse with stress/immunosuppression","points":[{"label":"","text":"± hindlimb/scrotal edema"}],"key":""}},{"name":"Leptospirosis (hemolytic serovars)","desc":"L. Pomona — INTRAvascular hemolysis + HEMOGLOBINURIA, esp. CALVES; ± fever, jaundice, agalactia (adults). Serology/PCR. Key: red urine + calf + no tick history → think Lepto vs Babesia.","s":{"finding":"L. Pomona — INTRAvascular hemolysis + HEMOGLOBINURIA, esp","points":[{"label":"","text":"CALVES; ± fever, jaundice, agalactia (adults)"},{"label":"","text":"Serology/PCR"}],"key":"red urine + calf + no tick history → think Lepto vs Babesia"}},{"name":"Quick urine-color triage","desc":"RED/BROWN urine (Hb) = INTRAvascular: Babesia, Lepto (Pomona), bacillary hemoglobinuria, copper crisis, post-parturient hemoglobinuria, water intoxication. NORMAL urine + icterus = EXTRAvascular: Anaplasma, Mycoplasma, Theileria. Always confirm Hb-uria vs hematuria (spin urine: Hb stays red, RBC pellet).","s":{"finding":"","points":[{"label":"RED/BROWN urine (Hb) = INTRAvascular","items":["Babesia","Lepto (Pomona)","bacillary hemoglobinuria","copper crisis","post-parturient hemoglobinuria","water intoxication"]},{"label":"NORMAL urine + icterus = EXTRAvascular","items":["Anaplasma","Mycoplasma","Theileria"]},{"label":"","text":"Always confirm Hb-uria vs hematuria (spin urine: Hb stays red, RBC pellet)"}],"key":""}}]},{"title":"LEUKOGRAM PATTERNS","items":[{"name":"Stress / steroid leukogram","desc":"Mature NEUTROPHILIA + LYMPHOPENIA + EOSINOPENIA ± monocytosis. Endogenous cortisol (pain, disease, transport) or exogenous steroids. NO left shift, NO toxic change. Very common — don't mistake for infection.","s":{"finding":"Mature NEUTROPHILIA + LYMPHOPENIA + EOSINOPENIA ± monocytosis","points":[{"label":"","text":"Endogenous cortisol (pain, disease, transport) or exogenous steroids"},{"label":"","text":"NO left shift, NO toxic change"},{"label":"","text":"Very common — don't mistake for infection"}],"key":""}},{"name":"Acute overwhelming infection","desc":"NEUTROPENIA + LEFT SHIFT (bands) + TOXIC CHANGE. Marrow reserve exhausted. Classic in coliform mastitis, acute peritonitis/metritis, severe salmonellosis, endotoxemia. GUARDED prognosis — flag urgently.","s":{"finding":"NEUTROPENIA + LEFT SHIFT (bands) + TOXIC CHANGE","points":[{"label":"","text":"Marrow reserve exhausted"},{"label":"","text":"Classic in coliform mastitis, acute peritonitis/metritis, severe salmonellosis, endotoxemia"},{"label":"","text":"GUARDED prognosis — flag urgently"}],"key":""}},{"name":"Chronic / established inflammation","desc":"NEUTROPHILIA + LEFT SHIFT (regenerative) + MONOCYTOSIS ± hyperfibrinogenemia ± hyperglobulinemia. Marrow keeping pace. Abscess, TRP, chronic pneumonia, arthritis.","s":{"finding":"NEUTROPHILIA + LEFT SHIFT (regenerative) + MONOCYTOSIS ± hyperfibrinogenemia ± hyperglobulinemia","points":[{"label":"","text":"Marrow keeping pace"},{"label":"","text":"Abscess, TRP, chronic pneumonia, arthritis"}],"key":""}},{"name":"Excitement / physiologic","desc":"LYMPHOCYTOSIS ± mild neutrophilia (catecholamine, transient). Young/fractious cattle. Resolves on rest — not disease.","s":{"finding":"LYMPHOCYTOSIS ± mild neutrophilia (catecholamine, transient)","points":[{"label":"","text":"Young/fractious cattle"},{"label":"","text":"Resolves on rest — not disease"}],"key":""}},{"name":"BLV / enzootic bovine leukosis","desc":"Persistent MARKED LYMPHOCYTOSIS (mature lymphocytes) over weeks–months. Confirm BLV serology/PCR. Subset progress to multicentric lymphoma.","s":{"finding":"Persistent MARKED LYMPHOCYTOSIS (mature lymphocytes) over weeks–months","points":[{"label":"","text":"Confirm BLV serology/PCR"},{"label":"","text":"Subset progress to multicentric lymphoma"}],"key":""}},{"name":"N:L ratio note","desc":"Healthy cattle: lymphocytes > neutrophils (N:L ≈ 0.5). A \"normal-looking\" N:L (≈1) in cattle already signals stress/early inflammation — always compare to the lymphocyte-predominant baseline.","s":{"finding":"Healthy cattle: lymphocytes > neutrophils (N:L ≈ 0.5)","points":[{"label":"","text":"A \"normal-looking\" N:L (≈1) in cattle already signals stress/early inflammation — always compare to the lymphocyte-predominant baseline"}],"key":""}}]},{"title":"BLOOD SMEAR MORPHOLOGY","items":[{"name":"Regeneration markers (cattle)","desc":"Basophilic stippling (PROMINENT in ruminants), anisocytosis, polychromasia, Howell-Jolly bodies, nucleated RBC. NB basophilic stippling ALSO occurs in LEAD toxicity — correlate with history/clinical signs.","s":{"finding":"Basophilic stippling (PROMINENT in ruminants), anisocytosis, polychromasia, Howell-Jolly bodies, nucleated RBC","points":[{"label":"","text":"NB basophilic stippling ALSO occurs in LEAD toxicity — correlate with history/clinical signs"}],"key":""}},{"name":"Heinz bodies","desc":"Oxidative damage: onion/brassica (kale, rape), copper toxicity, selenium, post-parturient hemoglobinuria. Round membrane projections on RBC. Cause hemolysis + falsely ↑ MCHC/Hb.","s":{"finding":"","points":[{"label":"Oxidative damage","items":["onion/brassica (kale, rape)","copper toxicity","selenium","post-parturient hemoglobinuria"]},{"label":"","text":"Round membrane projections on RBC"},{"label":"","text":"Cause hemolysis + falsely ↑ MCHC/Hb"}],"key":""}},{"name":"Schistocytes / fragments","desc":"DIC, vasculitis, microangiopathy, iron deficiency. With thrombocytopenia + prolonged clotting times → suspect DIC.","s":{"finding":"DIC, vasculitis, microangiopathy, iron deficiency","points":[{"label":"","text":"With thrombocytopenia + prolonged clotting times → suspect DIC"}],"key":""}},{"name":"Spherocytes","desc":"Immune-mediated hemolysis (uncommon in cattle vs dog); hard to identify in cattle due to small RBC and lack of central pallor.","s":{"finding":"Immune-mediated hemolysis (uncommon in cattle vs dog); hard to identify in cattle due to small RBC and lack of central pallor","points":[],"key":""}},{"name":"RBC parasites","desc":"Anaplasma marginale (marginal inclusion body — extravascular hemolysis, icterus, NO hemoglobinuria); Babesia (intraerythrocytic piroplasm — intravascular hemolysis, hemoglobinuria); Theileria; Mycoplasma wenyonii (epicellular).","s":{"finding":"","points":[{"label":"","items":["Anaplasma marginale (marginal inclusion body — extravascular hemolysis, icterus, NO hemoglobinuria)","Babesia (intraerythrocytic piroplasm — intravascular hemolysis, hemoglobinuria)","Theileria","Mycoplasma wenyonii (epicellular)"]}],"key":""}},{"name":"Toxic neutrophils","desc":"Döhle bodies, cytoplasmic basophilia/vacuolation, toxic granulation. Indicate severe systemic inflammation/toxemia — grade mild/moderate/marked.","s":{"finding":"Döhle bodies, cytoplasmic basophilia/vacuolation, toxic granulation","points":[{"label":"","text":"Indicate severe systemic inflammation/toxemia — grade mild/moderate/marked"}],"key":""}},{"name":"Reactive lymphocytes","desc":"Larger, deeper-blue cytoplasm — antigenic stimulation (viral, vaccination, chronic infection). Distinguish from neoplastic (BLV) forms.","s":{"finding":"Larger, deeper-blue cytoplasm — antigenic stimulation (viral, vaccination, chronic infection)","points":[{"label":"","text":"Distinguish from neoplastic (BLV) forms"}],"key":""}}]},{"title":"LIVER PATTERNS","items":[{"name":"Hepatocellular injury (leakage)","desc":"↑ GLDH + ↑ SDH + ↑ AST (with normal CK). Acute active damage. Fatty liver, toxic (pyrrolizidine, aflatoxin, copper), necrosis, hypoxia. GLDH short half-life → high = ONGOING injury.","s":{"finding":"↑ GLDH + ↑ SDH + ↑ AST (with normal CK)","points":[{"label":"","text":"Acute active damage"},{"label":"","text":"Fatty liver, toxic (pyrrolizidine, aflatoxin, copper), necrosis, hypoxia"},{"label":"","text":"GLDH short half-life → high = ONGOING injury"}],"key":""}},{"name":"Cholestatic / biliary","desc":"↑ GGT (± ↑ conjugated bilirubin). Obstruction or biliary hyperplasia. Fluke (Fasciola), cholangitis, cholelithiasis, chronic toxic biliary damage.","s":{"finding":"↑ GGT (± ↑ conjugated bilirubin)","points":[{"label":"","text":"Obstruction or biliary hyperplasia"},{"label":"","text":"Fluke (Fasciola), cholangitis, cholelithiasis, chronic toxic biliary damage"}],"key":""}},{"name":"Mixed (most real cases)","desc":"Fatty liver and toxic hepatopathies raise BOTH ↑GLDH and ↑GGT. Grade the rise: mild (5× upper reference).","s":{"finding":"Fatty liver and toxic hepatopathies raise BOTH ↑GLDH and ↑GGT","points":[{"label":"","text":"Grade the rise: mild (5× upper reference)"}],"key":""}},{"name":"Reduced function (not just damage)","desc":"↑ bile acids + ↓ albumin + ↓ urea (↓ synthesis) + ↓ glucose (late) + prolonged clotting + ↑ ammonia. Indicates LOSS OF FUNCTIONAL MASS — chronic/end-stage. Enzymes may even normalize as liver \"burns out\".","s":{"finding":"↑ bile acids + ↓ albumin + ↓ urea (↓ synthesis) + ↓ glucose (late) + prolonged clotting + ↑ ammonia","points":[{"label":"","text":"Indicates LOSS OF FUNCTIONAL MASS — chronic/end-stage"},{"label":"","text":"Enzymes may even normalize as liver \"burns out\""}],"key":""}},{"name":"Anorexia artefact (cattle)","desc":"Mild ↑ unconjugated bilirubin in an off-feed cow is PHYSIOLOGIC. Don't diagnose liver disease on bilirubin alone — confirm with GGT/GLDH.","s":{"finding":"Mild ↑ unconjugated bilirubin in an off-feed cow is PHYSIOLOGIC","points":[{"label":"","text":"Don't diagnose liver disease on bilirubin alone — confirm with GGT/GLDH"}],"key":""}},{"name":"AST muscle vs liver","desc":"↑ AST alone is ambiguous. ↑AST + ↑CK = muscle. ↑AST + normal CK + ↑GLDH/GGT = liver.","s":{"finding":"↑ AST alone is ambiguous","points":[{"label":"","text":"↑AST + ↑CK = muscle"},{"label":"","text":"↑AST + normal CK + ↑GLDH/GGT = liver"}],"key":""}}]},{"title":"AZOTEMIA — pre / renal / post-renal","items":[{"name":"Pre-renal","desc":"↑ urea + ↑ creatinine WITH concentrated urine (USG >1.025). Reduced perfusion: dehydration, shock, heart failure. REVERSIBLE with fluids. Often ↑PCV/↑TP too.","s":{"finding":"↑ urea + ↑ creatinine WITH concentrated urine (USG >1.025)","points":[{"label":"Reduced perfusion","items":["dehydration","shock","heart failure"]},{"label":"","text":"REVERSIBLE with fluids"},{"label":"","text":"Often ↑PCV/↑TP too"}],"key":""}},{"name":"Renal","desc":"↑ urea + ↑ creatinine WITH isosthenuria (USG 1.008–1.012). ≥75% nephron loss. Pyelonephritis, amyloidosis, nephrosis, toxic. ± proteinuria, ↑ phosphate, ± hyperkalemia. Guarded prognosis.","s":{"finding":"↑ urea + ↑ creatinine WITH isosthenuria (USG 1.008–1.012). ≥75% nephron loss","points":[{"label":"","text":"Pyelonephritis, amyloidosis, nephrosis, toxic"},{"label":"","text":"± proteinuria, ↑ phosphate, ± hyperkalemia"},{"label":"","text":"Guarded prognosis"}],"key":""}},{"name":"Post-renal","desc":"↑ urea + ↑ creatinine + obstruction/rupture. Urolithiasis (steers) — stranguria, distended bladder. Uroperitoneum (calf) — abdominal fluid creatinine:serum >2:1, hyponatremia, hyperkalemia, azotemia.","s":{"finding":"↑ urea + ↑ creatinine + obstruction/rupture","points":[{"label":"","text":"Urolithiasis (steers) — stranguria, distended bladder"},{"label":"","text":"Uroperitoneum (calf) — abdominal fluid creatinine:serum >2:1, hyponatremia, hyperkalemia, azotemia"}],"key":""}},{"name":"Pyelonephritis clues","desc":"↑ urea/creatinine + neutrophilia + hyperfibrinogenemia + hyperglobulinemia + pyuria/hematuria/proteinuria. Often unilateral — enlarged painful kidney on rectal. Corynebacterium renale, E. coli.","s":{"finding":"↑ urea/creatinine + neutrophilia + hyperfibrinogenemia + hyperglobulinemia + pyuria/hematuria/proteinuria","points":[{"label":"","text":"Often unilateral — enlarged painful kidney on rectal"},{"label":"","text":"Corynebacterium renale, E. coli"}],"key":""}},{"name":"Timing note","desc":"Creatinine often rises before urea and is less diet-affected in cattle. But azotemia is a LATE marker — significant renal damage precedes it. Urine (USG, protein, sediment) adds sensitivity.","s":{"finding":"Creatinine often rises before urea and is less diet-affected in cattle","points":[{"label":"","text":"But azotemia is a LATE marker — significant renal damage precedes it"},{"label":"","text":"Urine (USG, protein, sediment) adds sensitivity"}],"key":""}}]},{"title":"MUSCLE PATTERNS","items":[{"name":"Downer cow / pressure myopathy","desc":"Massive ↑CK (often >10,000 U/L) + ↑AST. Prolonged recumbency → ischemic muscle necrosis → more recumbency (vicious cycle). Serial CK: rising = ongoing damage/poor prognosis; falling = recovering. Watch for myoglobinuric renal injury.","s":{"finding":"Massive ↑CK (often >10,000 U/L) + ↑AST","points":[{"label":"","text":"Prolonged recumbency → ischemic muscle necrosis → more recumbency (vicious cycle)"},{"label":"Serial CK","items":["rising = ongoing damage/poor prognosis","falling = recovering"]},{"label":"","text":"Watch for myoglobinuric renal injury"}],"key":""}},{"name":"White muscle disease (nutritional)","desc":"↑CK + ↑AST in calves/young stock. Selenium/vitamin E deficiency. Cardiac form (sudden death) or skeletal form (weakness, stiffness). Confirm with GSH-Px / selenium levels.","s":{"finding":"↑CK + ↑AST in calves/young stock","points":[{"label":"","text":"Selenium/vitamin E deficiency"},{"label":"","text":"Cardiac form (sudden death) or skeletal form (weakness, stiffness)"},{"label":"","text":"Confirm with GSH-Px / selenium levels"}],"key":""}},{"name":"Timing the injury (CK vs AST)","desc":"CK fast up/fast down; AST slow up/slow down. Their relative levels date the insult (see AST note). Useful to tell fresh from resolving myopathy.","s":{"finding":"CK fast up/fast down; AST slow up/slow down","points":[{"label":"","text":"Their relative levels date the insult (see AST note)"},{"label":"","text":"Useful to tell fresh from resolving myopathy"}],"key":""}},{"name":"Muscle vs liver AST","desc":"↑AST + ↑CK = muscle origin. ↑AST + normal CK + ↑GLDH/GGT = liver origin. Always run CK before blaming the liver for a high AST.","s":{"finding":"↑AST + ↑CK = muscle origin","points":[{"label":"","text":"↑AST + normal CK + ↑GLDH/GGT = liver origin"},{"label":"","text":"Always run CK before blaming the liver for a high AST"}],"key":""}}]},{"title":"ELECTROLYTE / ACID-BASE PATTERNS","items":[{"name":"Abomasal disease signature","desc":"HYPOchloremia + HYPOkalemia + metabolic ALKALOSIS + paradoxical aciduria. Abomasal volvulus, LDA/RDA, vagal indigestion. Sequestered HCl in abomasum.","s":{"finding":"HYPOchloremia + HYPOkalemia + metabolic ALKALOSIS + paradoxical aciduria","points":[{"label":"","text":"Abomasal volvulus, LDA/RDA, vagal indigestion"},{"label":"","text":"Sequestered HCl in abomasum"}],"key":""}},{"name":"Grain overload / ruminal acidosis","desc":"Metabolic ACIDOSIS + high anion gap (lactate) + hemoconcentration + later hypocalcemia. Rumen pH <5.5. Dehydration from osmotic fluid shift into rumen.","s":{"finding":"Metabolic ACIDOSIS + high anion gap (lactate) + hemoconcentration + later hypocalcemia","points":[{"label":"","text":"Rumen pH <5.5"},{"label":"","text":"Dehydration from osmotic fluid shift into rumen"}],"key":""}},{"name":"Calf diarrhea","desc":"Metabolic ACIDOSIS (bicarbonate loss) + variable Na + often HYPERkalemia (acidosis shifts K out; total body K actually low) + azotemia (pre-renal). Estimate acidosis by age/demeanour for bicarbonate therapy.","s":{"finding":"Metabolic ACIDOSIS (bicarbonate loss) + variable Na + often HYPERkalemia (acidosis shifts K out; total body K actually low) + azotemia (pre-renal)","points":[{"label":"","text":"Estimate acidosis by age/demeanour for bicarbonate therapy"}],"key":""}},{"name":"Uroperitoneum (ruptured bladder, calf)","desc":"HYPERkalemia + HYPOnatremia + HYPOchloremia + azotemia. Abdominal fluid creatinine:serum >2:1. Surgical emergency.","s":{"finding":"HYPERkalemia + HYPOnatremia + HYPOchloremia + azotemia","points":[{"label":"","text":"Abdominal fluid creatinine:serum >2:1"},{"label":"","text":"Surgical emergency"}],"key":""}},{"name":"Anorexic/downer cow","desc":"HYPOkalemia (anorexia) ± hypocalcemia ± hypophosphatemia ± hypomagnesemia. Contributes to weakness and inability to rise.","s":{"finding":"HYPOkalemia (anorexia) ± hypocalcemia ± hypophosphatemia ± hypomagnesemia","points":[{"label":"","text":"Contributes to weakness and inability to rise"}],"key":""}},{"name":"Metabolic acidosis — causes","desc":"pH <7.35 + HCO3 <20 mEq/L; anion gap >30 in severe cases. Causes: Abomasal volvulus / ischemic gut, Blackleg / clostridial myositis, DIC, Grain overload / SARA (D- and L-lactate), Heat stroke, Renal failure / uremia, Severe dehydration / shock, Calf diarrhea (bicarbonate loss).","s":{"finding":"pH <7.35 + HCO3 <20 mEq/L; anion gap >30 in severe cases","points":[{"label":"Causes","items":["Abomasal volvulus / ischemic gut","Blackleg / clostridial myositis","DIC","Grain overload / SARA (D- and L-lactate)","Heat stroke","Renal failure / uremia","Severe dehydration / shock","Calf diarrhea (bicarbonate loss)"]}],"key":""}},{"name":"Metabolic alkalosis — causes","desc":"Hypochloremic alkalosis, Cl⁻ <70 mmol/L with abomasal reflux; paradoxical aciduria. Causes: Abomasal displacement / obstruction (RDA / AV most severe, LDA mild), Excessive bicarbonate therapy, Vagal indigestion (abomasal reflux).","s":{"finding":"Hypochloremic alkalosis, Cl⁻ <70 mmol/L with abomasal reflux; paradoxical aciduria","points":[{"label":"Causes","items":["Abomasal displacement / obstruction (RDA / AV most severe, LDA mild)","Excessive bicarbonate therapy","Vagal indigestion (abomasal reflux)"]}],"key":""}}]},{"title":"MINERAL PATTERNS & RATIOS","items":[{"name":"Milk fever (parturient hypocalcemia)","desc":"↓↓ Ca (often <1.5) ± ↓ P ± mild ↑ glucose. Periparturient dairy cow, recumbent, flaccid, cold, bradycardia/tachyarrhythmia. Responds to IV Ca.","s":{"finding":"↓↓ Ca (often <1.5) ± ↓ P ± mild ↑ glucose","points":[{"label":"","text":"Periparturient dairy cow, recumbent, flaccid, cold, bradycardia/tachyarrhythmia"},{"label":"","text":"Responds to IV Ca"}],"key":""}},{"name":"Grass tetany (hypomagnesemia)","desc":"↓↓ Mg ± ↓ Ca. Lush spring/autumn pasture. HYPERexcitable, tetanic, convulsions, sudden death — opposite demeanour to milk fever. Emergency Mg + Ca.","s":{"finding":"↓↓ Mg ± ↓ Ca","points":[{"label":"","text":"Lush spring/autumn pasture"},{"label":"","text":"HYPERexcitable, tetanic, convulsions, sudden death — opposite demeanour to milk fever"},{"label":"","text":"Emergency Mg + Ca"}],"key":""}},{"name":"Downer cow mineral panel","desc":"Often combined ↓Ca + ↓P + ↓Mg + ↓K. Check all four — correct the deficits. ↑CK from pressure myopathy compounds the recumbency.","s":{"finding":"Often combined ↓Ca + ↓P + ↓Mg + ↓K","points":[{"label":"","text":"Check all four — correct the deficits"},{"label":"","text":"↑CK from pressure myopathy compounds the recumbency"}],"key":""}},{"name":"Ca:P ratio","desc":"Normal dietary Ca:P ~1.5–2:1. Inverted ratio (high P, low Ca) predisposes to urolithiasis in steers and to nutritional secondary hyperparathyroidism (rubber jaw / osteodystrophy) on grain-heavy, low-Ca diets.","s":{"finding":"Normal dietary Ca:P ~1.5–2:1","points":[{"label":"","text":"Inverted ratio (high P, low Ca) predisposes to urolithiasis in steers and to nutritional secondary hyperparathyroidism (rubber jaw / osteodystrophy) on grain-heavy, low-Ca diets"}],"key":""}},{"name":"Post-parturient hemoglobinuria","desc":"↓↓ Phosphate + intravascular hemolysis + hemoglobinuria in a fresh high-yielding dairy cow. Distinct from babesiosis (no tick/parasite).","s":{"finding":"↓↓ Phosphate + intravascular hemolysis + hemoglobinuria in a fresh high-yielding dairy cow","points":[{"label":"","text":"Distinct from babesiosis (no tick/parasite)"}],"key":""}}]},{"title":"ENERGY / NEB PATTERNS","items":[{"name":"Clinical ketosis (dairy)","desc":"↓ glucose + ↑↑ BHB (>2.6–3.0) + ↑ NEFA, early lactation. Off feed, milk drop, weight loss, ± nervous signs. Often secondary to LDA/metritis — hunt the primary.","s":{"finding":"↓ glucose + ↑↑ BHB (>2.6–3.0) + ↑ NEFA, early lactation","points":[{"label":"","text":"Off feed, milk drop, weight loss, ± nervous signs"},{"label":"","text":"Often secondary to LDA/metritis — hunt the primary"}],"key":""}},{"name":"Subclinical ketosis (herd)","desc":"BHB 1.2–2.9 without overt signs. Screen 3–14 DIM. Predicts LDA, metritis, poor fertility, lost milk. A herd-level management flag.","s":{"finding":"BHB 1.2–2.9 without overt signs","points":[{"label":"","text":"Screen 3–14 DIM"},{"label":"","text":"Predicts LDA, metritis, poor fertility, lost milk"},{"label":"","text":"A herd-level management flag"}],"key":""}},{"name":"Pregnancy toxemia","desc":"↓ glucose + ↑↑ BHB + ↑↑ NEFA in LATE-gestation beef cow/ewe with multiple fetuses. ± fatty liver, ± azotemia. Guarded — may need C-section/induction.","s":{"finding":"↓ glucose + ↑↑ BHB + ↑↑ NEFA in LATE-gestation beef cow/ewe with multiple fetuses","points":[{"label":"","text":"± fatty liver, ± azotemia"},{"label":"","text":"Guarded — may need C-section/induction"}],"key":""}},{"name":"Fatty liver (hepatic lipidosis)","desc":"↑ NEFA + ↑ BHB + ↑ GLDH/GGT + ↓ albumin + over-conditioned cow that went off feed at calving. Confirm with liver biopsy. Poor prognosis if severe.","s":{"finding":"↑ NEFA + ↑ BHB + ↑ GLDH/GGT + ↓ albumin + over-conditioned cow that went off feed at calving","points":[{"label":"","text":"Confirm with liver biopsy"},{"label":"","text":"Poor prognosis if severe"}],"key":""}},{"name":"Stress hyperglycemia (don't misread)","desc":"↑ glucose alone from handling/pain/xylazine, with NORMAL BHB/NEFA. Transient, not metabolic disease. Always pair glucose with ketone/NEFA in transition cows.","s":{"finding":"↑ glucose alone from handling/pain/xylazine, with NORMAL BHB/NEFA","points":[{"label":"","text":"Transient, not metabolic disease"},{"label":"","text":"Always pair glucose with ketone/NEFA in transition cows"}],"key":""}}]},{"title":"ACUTE-PHASE RESPONSE","items":[{"name":"Speed of response","desc":"SAA fastest (hours) → haptoglobin (1–2 days) → fibrinogen (2 days). Combine to date the inflammation and follow its course.","s":{"finding":"SAA fastest (hours) → haptoglobin (1–2 days) → fibrinogen (2 days)","points":[{"label":"","text":"Combine to date the inflammation and follow its course"}],"key":""}},{"name":"Detecting subclinical disease","desc":"↑ haptoglobin / ↑ SAA reveal inflammation not yet clinically obvious (early mastitis/metritis, subclinical infection). Useful herd-health screening.","s":{"finding":"↑ haptoglobin / ↑ SAA reveal inflammation not yet clinically obvious (early mastitis/metritis, subclinical infection)","points":[{"label":"","text":"Useful herd-health screening"}],"key":""}},{"name":"Grading severity & monitoring","desc":"Magnitude correlates with severity; serial measurement tracks response to therapy (falling = resolving). More sensitive than WBC in cattle in some settings.","s":{"finding":"Magnitude correlates with severity; serial measurement tracks response to therapy (falling = resolving)","points":[{"label":"","text":"More sensitive than WBC in cattle in some settings"}],"key":""}},{"name":"Hemolysis caveat","desc":"Intravascular hemolysis CONSUMES haptoglobin → a falsely low value despite inflammation. Cross-check with SAA/fibrinogen if hemolysis suspected.","s":{"finding":"Intravascular hemolysis CONSUMES haptoglobin → a falsely low value despite inflammation","points":[{"label":"","text":"Cross-check with SAA/fibrinogen if hemolysis suspected"}],"key":""}}]},{"title":"DOWNER / RECUMBENT COW","items":[{"name":"Milk fever (parturient hypocalcemia)","desc":"↓↓ Ca (<1.5) ± ↓ P ± ↑ glucose. Periparturient, flaccid, cold.","s":{"finding":"↓↓ Ca (<1.5) ± ↓ P ± ↑ glucose","points":[{"label":"","text":"Periparturient, flaccid, cold"}],"key":""}},{"name":"Secondary pressure myopathy (any downer)","desc":"↑↑ CK + ↑ AST (rises with time down). Serial CK grades ongoing damage. Watch myoglobinuria → renal injury.","s":{"finding":"↑↑ CK + ↑ AST (rises with time down)","points":[{"label":"","text":"Serial CK grades ongoing damage"},{"label":"","text":"Watch myoglobinuria → renal injury"}],"key":""}},{"name":"Concurrent deficits","desc":"Often ↓K (anorexia) + ↓Mg ± ↓P. Check the whole mineral/electrolyte panel.","s":{"finding":"Often ↓K (anorexia) + ↓Mg ± ↓P. Check the whole mineral/electrolyte panel","points":[],"key":""}},{"name":"Toxic/septic downer","desc":"↓ glucose (late), neutropenia + left shift + toxic change, ↑ haptoglobin/SAA — endotoxemia (coliform mastitis, metritis, peritonitis).","s":{"finding":"↓ glucose (late), neutropenia + left shift + toxic change, ↑ haptoglobin/SAA — endotoxemia (coliform mastitis, metritis, peritonitis)","points":[],"key":""}}]},{"title":"FATTY LIVER / KETOSIS (transition cow)","items":[{"name":"Energy markers","desc":"↑↑ BHB + ↑ NEFA + ↓ glucose. Early-lactation NEB.","s":{"finding":"↑↑ BHB + ↑ NEFA + ↓ glucose","points":[{"label":"","text":"Early-lactation NEB"}],"key":""}},{"name":"Liver involvement","desc":"↑ GLDH + ↑ GGT + ↓ albumin (chronic) ± ↑ bilirubin (anorexia adds to this).","s":{"finding":"↑ GLDH + ↑ GGT + ↓ albumin (chronic) ± ↑ bilirubin (anorexia adds to this)","points":[],"key":""}},{"name":"Severity / prognosis","desc":"Over-conditioned cow off feed at calving; marked ↓albumin + ↓glucose + high BHB → guarded. Confirm lipidosis by liver biopsy.","s":{"finding":"Over-conditioned cow off feed at calving; marked ↓albumin + ↓glucose + high BHB → guarded","points":[{"label":"","text":"Confirm lipidosis by liver biopsy"}],"key":""}},{"name":"Look for the trigger","desc":"Ketosis is often SECONDARY — rule out LDA, metritis, mastitis driving the off-feed state.","s":{"finding":"Ketosis is often SECONDARY — rule out LDA, metritis, mastitis driving the off-feed state","points":[],"key":""}}]},{"title":"CHRONIC WEIGHT LOSS / ILL-THRIFT","items":[{"name":"Chronic inflammation","desc":"↓ albumin + ↑ globulin → low A:G, ↑ fibrinogen/haptoglobin, mild non-regenerative anemia. Hunt a focus (abscess, TRP, chronic pneumonia).","s":{"finding":"↓ albumin + ↑ globulin → low A:G, ↑ fibrinogen/haptoglobin, mild non-regenerative anemia","points":[{"label":"","text":"Hunt a focus (abscess, TRP, chronic pneumonia)"}],"key":""}},{"name":"Protein-losing enteropathy (Johne)","desc":"↓ albumin AND ↓ globulin (panhypoproteinemia) + weight loss + diarrhea. Confirm Johne (ELISA/fecal PCR).","s":{"finding":"↓ albumin AND ↓ globulin (panhypoproteinemia) + weight loss + diarrhea","points":[{"label":"","text":"Confirm Johne (ELISA/fecal PCR)"}],"key":""}},{"name":"Organ failure","desc":"Liver: ↑ GGT/GLDH, ↓ albumin, ↑ bile acids. Renal: azotemia + isosthenuria + proteinuria. Check both.","s":{"finding":"","points":[{"label":"Liver","items":["↑ GGT/GLDH","↓ albumin","↑ bile acids"]},{"label":"","text":"Renal: azotemia + isosthenuria + proteinuria"},{"label":"","text":"Check both"}],"key":""}},{"name":"Parasitism / deficiency","desc":"Eosinophilia, iron-deficiency (microcytic) anemia, ↓ albumin. ± trace-element deficiency (Cu, Se). Common in young/grazing stock.","s":{"finding":"Eosinophilia, iron-deficiency (microcytic) anemia, ↓ albumin","points":[{"label":"","text":"± trace-element deficiency (Cu, Se)"},{"label":"","text":"Common in young/grazing stock"}],"key":""}}]},{"title":"SUSPECTED RENAL FAILURE","items":[{"name":"Azotemia + urine","desc":"↑ urea + ↑ creatinine WITH isosthenuria (USG 1.008–1.012) = renal. Concentrated urine = pre-renal instead.","s":{"finding":"↑ urea + ↑ creatinine WITH isosthenuria (USG 1.008–1.012) = renal","points":[{"label":"","text":"Concentrated urine = pre-renal instead"}],"key":""}},{"name":"Supporting changes","desc":"↑ phosphate, ± hyperkalemia (oliguria), metabolic acidosis, ± hypocalcemia, proteinuria.","s":{"finding":"↑ phosphate, ± hyperkalemia (oliguria), metabolic acidosis, ± hypocalcemia, proteinuria","points":[],"key":""}},{"name":"Pyelonephritis","desc":"Add neutrophilia + hyperfibrinogenemia + hyperglobulinemia + pyuria/hematuria; enlarged painful kidney on rectal.","s":{"finding":"Add neutrophilia + hyperfibrinogenemia + hyperglobulinemia + pyuria/hematuria; enlarged painful kidney on rectal","points":[],"key":""}},{"name":"Post-renal (don't miss)","desc":"Obstruction (urolithiasis, steers) or ruptured bladder (calf): azotemia + hyperkalemia + hyponatremia; abdominal fluid creatinine:serum >2:1.","s":{"finding":"Obstruction (urolithiasis, steers) or ruptured bladder (calf): azotemia + hyperkalemia + hyponatremia; abdominal fluid creatinine:serum >2:1","points":[],"key":""}}]},{"title":"DEHYDRATION vs OVERHYDRATION","items":[{"name":"Dehydration (hemoconcentration)","desc":"↑ PCV + ↑ TP + ↑ albumin together; pre-renal azotemia with concentrated urine; ± electrolyte shifts by cause.","s":{"finding":"","points":[{"label":"","items":["↑ PCV + ↑ TP + ↑ albumin together","pre-renal azotemia with concentrated urine","± electrolyte shifts by cause"]}],"key":""}},{"name":"Overhydration / dilution","desc":"↓ PCV + ↓ TP + ↓ albumin (dilutional); watch iatrogenic (excess IV fluids). Distinguish dilution from true protein loss/anemia by clinical fluid status.","s":{"finding":"↓ PCV + ↓ TP + ↓ albumin (dilutional); watch iatrogenic (excess IV fluids)","points":[{"label":"","text":"Distinguish dilution from true protein loss/anemia by clinical fluid status"}],"key":""}},{"name":"Blood loss vs hemolysis (low PCV)","desc": oned lymph nodes, lung","result":"Reactor (skin swelling); acid-fast bacilli; M. bovis isolation","pm":"Caseous, calcified yellow granulomas — retropharyngeal, bronchial, mediastinal nodes, lung","notifiable":true},{"group":"NOTIFIABLE / REPORTABLE","disease":"Vesicular stomatitis","test":"Antigen ELISA / RT-PCR — mainly to exclude FMD","sample":"Vesicular fluid, epithelium from fresh lesions","result":"VSV detected (clinically indistinguishable from FMD)","pm":"Vesicles / erosions of mouth, teats, feet — report as suspected FMD","notifiable":true},{"group":"VIRAL","disease":"Akabane / Schmallenberg","test":"PCR fetal brain / placenta; serology of pre-colostral newborn or dam","sample":"Fetal brain, placenta; pre-suckle serum","result":"Viral RNA; antibody in pre-colostral serum = in-utero infection","pm":"Arthrogryposis, hydranencephaly, cerebellar hypoplasia, scoliosis","notifiable":false},{"group":"VIRAL","disease":"Bovine ephemeral fever (BEF)","test":"RT-PCR on buffy coat; paired serology (VNT)","sample":"EDTA blood in febrile phase; paired sera 2–3 weeks apart","result":"BEFV RNA or 4-fold titre rise; hematology: neutrophilia with left shift, ↓ Ca","pm":"Serofibrinous polysynovitis, polyserositis, pulmonary emphysema (death uncommon)","notifiable":false},{"group":"VIRAL","disease":"BVD (PI / mucosal disease)","test":"Antigen ELISA / PCR (ear-notch)","sample":"Ear-notch; serum (Ag/Ab); whole blood","result":"PI: antigen+, antibody− (retest 3–4 wks); ± leucopenia/thrombocytopenia","pm":"Mucosal disease: linear (\"tramline\") esophageal erosions; Peyer-patch necrosis","notifiable":false},{"group":"VIRAL","disease":"EHDV (epizootic hemorrhagic disease)","test":"RT-PCR; ELISA (separate from BTV)","sample":"EDTA blood from febrile animals","result":"EHDV RNA","pm":"Hemorrhages, oral / GI erosions, edema — resembles bluetongue","notifiable":false},{"group":"VIRAL","disease":"Enzootic bovine leukosis (BLV)","test":"AGID / ELISA (serum, bulk milk); PCR; persistent lymphocytosis; biopsy / FNA of mass","sample":"Serum, milk, EDTA blood; tumor tissue","result":"Antibody+ = infected (most never develop tumors); lymphoma confirmed by cytology / histology","pm":"White-tan tumor masses — lymph nodes, right atrium, abomasum, uterus, retrobulbar, spinal canal","notifiable":false},{"group":"VIRAL","disease":"IBR (BoHV-1, \"red nose\")","test":"PCR / virus isolation; serology","sample":"Nasal/ocular swab; paired serum; trachea/lung at PM","result":"BoHV-1 detected; rising paired titre","pm":"Fibrinonecrotic (diphtheritic) tracheitis — pseudomembrane in trachea","notifiable":false},{"group":"VIRAL","disease":"MCF (malignant catarrhal fever)","test":"PCR (OvHV-2)","sample":"EDTA blood (PCR); lymph node/eye/brain at PM; sheep-contact history","result":"OvHV-2 DNA positive; histology: lymphocytic vasculitis","pm":"\"White nodules\" in kidney cortex; fibrinoid arterial necrosis","notifiable":false},{"group":"VIRAL","disease":"Orf (contagious ecthyma)","test":"Usually clinical; PCR / EM of scab","sample":"Scab material","result":"Parapoxvirus","pm":"Proliferative, scabby lesions on lips, nostrils, udder — zoonotic","notifiable":false},{"group":"VIRAL","disease":"Respiratory viruses (BRSV, PI-3, BCoV, IBR)","test":"PCR panel on nasal swabs / BAL; paired serology","sample":"Deep nasal swabs or BAL from 5–10 early, untreated cases","result":"Virus identified; seroconversion","pm":"BRSV: interstitial pneumonia + emphysema (± bullae); IBR: necrotic tracheitis with plaques","notifiable":false},{"group":"VIRAL","disease":"Small ruminant lentiviruses (CAE / maedi-visna)","test":"AGID / ELISA serology; PCR","sample":"Serum; milk","result":"Antibody+ (lifelong infection)","pm":"Heavy non-collapsing lungs (interstitial pneumonia), indurative mastitis, arthritis (CAE), leukoencephalomyelitis (kids)","notifiable":false},{"group":"BACTERIAL","disease":"Botulism","test":"Toxin detection (ELISA / bioassay) — often diagnosis by exclusion","sample":"Serum, rumen c   DATA.bloodwork.forEach(a=>{if(a.name.toLowerCase().includes(q))out.push({t:'bw',score:a.name.toLowerCase().startsWith(q)?0:1,label:a.name,sub:a.chapter,name:a.name});});
  DATA.tests.forEach((t,i)=>{if(t.disease.toLowerCase().includes(q))out.push({t:'tt',score:t.disease.toLowerCase().startsWith(q)?0:1,label:t.disease,sub:t.group,i,flag:t.notifiable});});
  DATA.patterns.forEach(p=>{p.items.forEach(it=>{if(it.name.toLowerCase().includes(q))out.push({t:'pt',score:2,label:it.name,sub:p.title,p:p.title,itn:it.name});});});
